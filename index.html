<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Rosenberg Health & Fitness</title>


<script
  src="https://unpkg.com/html5-qrcode"
  type="text/javascript">
</script>


<style>

/* =================================================
   GENERAL
================================================= */

* {
  box-sizing: border-box;
}


html,
body {

  margin: 0;

  width: 100%;
  min-height: 100%;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;

  background: #ffffff;

  color: #111111;

  text-align: center;

}


/* =================================================
   BACKGROUND WATERMARK
================================================= */

body::before {

  content: "";

  position: fixed;

  top: 50%;
  left: 50%;

  width: 850px;
  height: 850px;

  transform:
    translate(-50%, -50%);

  background-image:
    url("logo.png");

  background-repeat: no-repeat;

  background-position: center;

  background-size: contain;

  opacity: 0.045;

  filter: grayscale(100%);

  pointer-events: none;

  z-index: 0;

}


/* =================================================
   MAIN PAGE
================================================= */

.page {

  position: relative;

  z-index: 1;

  min-height: 100vh;

  display: flex;

  flex-direction: column;

}


/* =================================================
   HEADER
================================================= */

.header {

  background: #111111;

  color: #ffffff;

  padding:
    30px
    20px
    28px;

}


.header h1 {

  margin: 0;

  font-size: clamp(26px, 4vw, 38px);

  font-weight: 700;

  letter-spacing: 2px;

}


.header p {

  margin:
    9px
    0
    0;

  font-size: clamp(15px, 2.2vw, 19px);

  font-weight: 400;

  letter-spacing: 1px;

}


/* =================================================
   MAIN CONTENT
================================================= */

.container {

  width: 100%;

  max-width: 760px;

  margin: 0 auto;

  padding:
    34px
    24px
    20px;

  flex: 1;

}


/* =================================================
   INSTRUCTION
================================================= */

.instruction {

  display: flex;

  align-items: center;

  justify-content: center;

  gap: 18px;

  margin-bottom: 24px;

  font-size: clamp(19px, 3vw, 27px);

  font-weight: 600;

  letter-spacing: 1px;

}


.instruction::before,
.instruction::after {

  content: "";

  height: 1px;

  width: 80px;

  background: #111111;

}


/* =================================================
   SCANNER
================================================= */

#reader {

  width: 100%;

  max-width: 600px;

  margin: 0 auto;

  background: #111111;

  border-radius: 22px;

  overflow: hidden;

  border:
    5px solid
    #ffffff;

  box-shadow:
    0 8px 30px
    rgba(0,0,0,0.18);

}


/*
 * Remove the default html5-qrcode
 * border/title elements.
 */

#reader__dashboard_section {

  background: #111111 !important;

}


#reader__scan_region {

  background: #111111 !important;

}


#reader img {

  max-width: 100%;

}


/* =================================================
   STATUS
================================================= */

#status {

  display: inline-flex;

  align-items: center;

  justify-content: center;

  gap: 12px;

  margin-top: 24px;

  min-height: 52px;

  padding:
    12px
    28px;

  border-radius: 30px;

  background: #ffffff;

  border:
    1px solid
    #d7d7d7;

  box-shadow:
    0 4px 15px
    rgba(0,0,0,0.08);

  font-size: 18px;

  font-weight: 600;

  letter-spacing: 1px;

}


/* Small scanner icon */

#status.ready::before {

  content: "⌗";

  font-size: 25px;

  font-weight: 700;

}


.ready {

  color: #111111;

}


.processing {

  color: #555555;

}


.processing::before {

  content: "•••";

  letter-spacing: 3px;

}


.error {

  color: #ffffff !important;

  background: #111111 !important;

  border-color: #111111 !important;

}


.success {

  color: #111111;

}


/* =================================================
   RESULT SCREEN
================================================= */

.result {

  display: none;

  position: fixed;

  inset: 0;

  z-index: 20;

  background:
    rgba(255,255,255,0.94);

  backdrop-filter:
    blur(8px);

  align-items: center;

  justify-content: center;

  padding: 25px;

}


/* Faint logo on result screen */

.result::before {

  content: "";

  position: absolute;

  inset: 0;

  background-image:
    url("logo.png");

  background-repeat: no-repeat;

  background-position: center;

  background-size:
    min(750px, 90vw);

  opacity: 0.045;

  filter: grayscale(100%);

  pointer-events: none;

}


.resultCard {

  position: relative;

  z-index: 2;

  width: 100%;

  max-width: 560px;

  background: #ffffff;

  border-radius: 24px;

  overflow: hidden;

  box-shadow:
    0 15px 55px
    rgba(0,0,0,0.20);

  border:
    1px solid
    #e2e2e2;

}


/* =================================================
   RESULT CONTENT
================================================= */

.resultContent {

  padding:
    48px
    30px
    42px;

}


.resultIcon {

  width: 70px;
  height: 70px;

  margin:
    0 auto
    22px;

  display: flex;

  align-items: center;

  justify-content: center;

  border-radius: 50%;

  background: #111111;

  color: #ffffff;

  font-size: 38px;

  font-weight: 600;

}


.result h1 {

  margin:
    0
    0
    18px;

  font-size: clamp(27px, 5vw, 38px);

  font-weight: 700;

  letter-spacing: 2px;

}


.result .name {

  font-size: clamp(34px, 7vw, 48px);

  font-weight: 700;

  margin:
    10px
    0
    18px;

}


.result .message {

  font-size: 19px;

  color: #555555;

  letter-spacing: 0.5px;

}


.resultTime {

  font-size: 27px;

  font-weight: 500;

  margin-top: 10px;

}


/* =================================================
   RESULT FOOTER
================================================= */

.resultFooter {

  background: #111111;

  color: #ffffff;

  padding:
    17px
    20px;

  font-size: 15px;

  font-weight: 500;

  letter-spacing: 1px;

}


/* =================================================
   FOOTER
================================================= */

.footer {

  padding:
    18px
    20px
    25px;

  font-size: 13px;

  color: #777777;

  letter-spacing: 1px;

}


/* =================================================
   MOBILE / IPAD
================================================= */

@media (max-width: 700px) {

  .header {

    padding:
      24px
      15px
      22px;

  }


  .container {

    padding:
      25px
      15px
      15px;

  }


  .instruction::before,
  .instruction::after {

    width: 35px;

  }


  #reader {

    border-radius: 18px;

  }


  .resultContent {

    padding:
      40px
      20px
      35px;

  }

}


/* =================================================
   LARGE IPAD LANDSCAPE
================================================= */

@media (min-width: 900px) {

  .container {

    padding-top: 42px;

  }


  #reader {

    max-width: 620px;

  }

}

</style>

</head>


<body>


<div class="page">


  <!-- =============================================
       HEADER
  ============================================== -->

  <div class="header">

    <h1>
      ROSENBERG HEALTH &amp; FITNESS
    </h1>

    <p>
      Student Check-In / Check-Out
    </p>

  </div>


  <!-- =============================================
       MAIN SCANNER
  ============================================== -->

  <div class="container">


    <div id="scannerSection">


      <div class="instruction">

        Scan Your QR Code

      </div>


      <div id="reader"></div>


      <div
        id="status"
        class="ready"
      >

        Ready to scan

      </div>


    </div>


  </div>


  <!-- =============================================
       RESULT
  ============================================== -->

  <div
    id="result"
    class="result"
  >

    <div class="resultCard">


      <div class="resultContent">


        <div
          id="resultIcon"
          class="resultIcon"
        >
          ✓
        </div>


        <h1 id="resultTitle"></h1>


        <div
          id="resultName"
          class="name">
        </div>


        <div
          id="resultTime"
          class="resultTime">
        </div>


        <div
          id="resultMessage"
          class="message">
        </div>


      </div>


      <div
        id="resultFooter"
        class="resultFooter"
      >

        Returning to scanner...

      </div>


    </div>

  </div>


  <!-- =============================================
       FOOTER
  ============================================== -->

  <div class="footer">

    Health &amp; Fitness

  </div>


</div>


<script>


/*************************************************
 * GOOGLE APPS SCRIPT
 *************************************************/

const APPS_SCRIPT_URL =
  "https://script.google.com/a/macros/instrosenberg.ch/s/AKfycbzZq6AKRHz_6-ab83I6ALVQrsslcyKvlCASxOOOWKjindU6Byg0ZPRdIMGkJ1kk0Kx3/exec";


let scanner = null;

let scanLocked = false;


/*************************************************
 * START SCANNER
 *************************************************/

function startScanner() {

  scanner =
    new Html5Qrcode("reader");


  scanner.start(

    {
      facingMode: "environment"
    },

    {

      fps: 10,

      qrbox: {
        width: 300,
        height: 300
      }

    },

    function(decodedText) {

      if (scanLocked) {

        return;

      }

      scanLocked = true;

      processQRCode(decodedText);

    },

    function(errorMessage) {

      /*
       * Normal scanning errors
       * are ignored.
       */

    }

  )

  .catch(function(error) {

    console.error(error);

    document.getElementById(
      "status"
    ).textContent =
      "Camera could not be started. Please allow camera access.";

    document.getElementById(
      "status"
    ).className =
      "error";

  });

}


/*************************************************
 * PROCESS QR CODE
 *************************************************/

function processQRCode(studentId) {


  document.getElementById(
    "status"
  ).textContent =
    "Processing...";


  document.getElementById(
    "status"
  ).className =
    "processing";


  /*
   * Pause scanning while we process
   * the attendance record.
   *
   * IMPORTANT:
   * We DO NOT stop the camera.
   */

  try {

    scanner.pause(true);

  }

  catch (error) {

    console.log(error);

  }


  /*
   * Create a unique callback name.
   */

  const callbackName =
    "attendanceCallback_" +
    Date.now();


  /*
   * Create callback function.
   */

  window[callbackName] =
    function(result) {

      handleResult(result);

      /*
       * Clean up callback.
       */

      delete window[callbackName];

    };


  /*
   * JSONP request.
   */

  const script =
    document.createElement("script");


  script.src =
    APPS_SCRIPT_URL +
    "?id=" +
    encodeURIComponent(studentId) +
    "&callback=" +
    callbackName;


  script.onerror =
    function() {

      delete window[callbackName];

      showError(
        "Could not connect to the attendance system."
      );

      resumeScanner();

    };


  document.body.appendChild(script);

}


/*************************************************
 * SHOW RESULT
 *************************************************/

function handleResult(result) {


  /*
   * Hide scanner.
   */

  document.getElementById(
    "scannerSection"
  ).style.display =
    "none";


  /*
   * Show result screen.
   */

  const resultElement =
    document.getElementById(
      "result"
    );


  resultElement.style.display =
    "flex";


  /*
   * Populate result.
   */

  document.getElementById(
    "resultTitle"
  ).textContent =
    result.title;


  document.getElementById(
    "resultName"
  ).textContent =
    result.name;


  /*
   * Display message.
   */

  document.getElementById(
    "resultMessage"
  ).textContent =
    result.message;


  /*
   * Try to extract time from the
   * returned message if available.
   *
   * If no separate time is provided,
   * the message remains unchanged.
   */

  document.getElementById(
    "resultTime"
  ).textContent =
    "";


  /*
   * Determine icon and wording.
   */

  const title =
    String(result.title || "")
      .toUpperCase();


  const icon =
    document.getElementById(
      "resultIcon"
    );


  if (
    title.includes("CHECK-IN")
  ) {

    icon.textContent = "✓";

  }

  else if (
    title.includes("CHECK-OUT")
  ) {

    icon.textContent = "✓";

  }

  else {

    icon.textContent = "!";

  }


  /*
   * Show result for 3 seconds.
   */

  let seconds = 3;


  const footer =
    document.getElementById(
      "resultFooter"
    );


  footer.textContent =
    "Returning to scanner in " +
    seconds;


  const countdown =
    setInterval(function() {

      seconds--;


      if (seconds > 0) {

        footer.textContent =
          "Returning to scanner in " +
          seconds;

      }

    }, 1000);


  setTimeout(function() {

    clearInterval(countdown);


    resultElement.style.display =
      "none";


    document.getElementById(
      "scannerSection"
    ).style.display =
      "block";


    document.getElementById(
      "status"
    ).textContent =
      "Ready to scan";


    document.getElementById(
      "status"
    ).className =
      "ready";


    resumeScanner();

  }, 3000);

}


/*************************************************
 * RESUME CAMERA
 *************************************************/

function resumeScanner() {

  scanLocked = false;


  try {

    scanner.resume();

  }

  catch (error) {

    console.error(error);

  }

}


/*************************************************
 * ERROR
 *************************************************/

function showError(message) {

  document.getElementById(
    "scannerSection"
  ).style.display =
    "block";


  document.getElementById(
    "result"
  ).style.display =
    "none";


  document.getElementById(
    "status"
  ).textContent =
    message;


  document.getElementById(
    "status"
  ).className =
    "error";

}


/*************************************************
 * START WHEN PAGE LOADS
 *************************************************/

window.addEventListener(
  "load",
  startScanner
);

</script>


</body>

</html>
