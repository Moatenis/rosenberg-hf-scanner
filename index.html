<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Rosenberg Health & Fitness</title>


<script
  src="https://unpkg.com/html5-qrcode"
  type="text/javascript">
</script>


<style>

/* =================================================
   GENERAL
================================================= */

* {
  box-sizing: border-box;
}


html,
body {

  margin: 0;

  width: 100%;
  min-height: 100%;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;

  background: #ffffff;

  color: #111111;

  text-align: center;

}


/* =================================================
   PAGE
================================================= */

.page {

  position: relative;

  min-height: 100vh;

  display: flex;

  flex-direction: column;

  overflow: hidden;

}


/* =================================================
   SUBTLE BACKGROUND WATERMARK
================================================= */

.page::before {

  content: "";

  position: fixed;

  top: 54%;
  left: 50%;

  width: 900px;
  height: 900px;

  transform:
    translate(-50%, -50%);

  background-image:
    url("logo.png");

  background-repeat: no-repeat;

  background-position: center;

  background-size: contain;

  opacity: 0.035;

  filter: grayscale(100%);

  pointer-events: none;

  z-index: 0;

}


/* =================================================
   HEADER / BRANDING
================================================= */

.branding {

  position: relative;

  z-index: 2;

  padding:
    32px
    25px
    16px;

}


/* Rosenberg logo */

.schoolLogo {

  display: block;

  width: 165px;

  max-width: 40vw;

  height: auto;

  margin:
    0 auto
    16px;

}


/* =================================================
   H&F TITLE
================================================= */

.brandTitle {

  margin: 0;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:
    clamp(27px, 4vw, 38px);

  font-weight: 400;

  letter-spacing: 2px;

  line-height: 1.15;

}


.brandSubtitle {

  margin:
    9px
    0
    0;

  font-size:
    clamp(13px, 2vw, 16px);

  font-weight: 400;

  letter-spacing: 2px;

  text-transform: uppercase;

  color: #444444;

}


/* =================================================
   THIN DIVIDER
================================================= */

.divider {

  width: 85px;

  height: 1px;

  background: #111111;

  margin:
    19px
    auto
    0;

}


/* =================================================
   MAIN
================================================= */

.container {

  position: relative;

  z-index: 2;

  width: 100%;

  max-width: 700px;

  margin: 0 auto;

  padding:
    12px
    24px
    5px;

  flex: 1;

}


/* =================================================
   INSTRUCTION
================================================= */

.instruction {

  margin:
    0
    0
    16px;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:
    clamp(21px, 3vw, 28px);

  font-weight: 400;

  letter-spacing: 0.5px;

}


/* =================================================
   SCANNER FRAME
================================================= */

.scannerFrame {

  position: relative;

  width: 100%;

  max-width: 480px;

  margin: 0 auto;

  padding: 6px;

  background: #ffffff;

  border:
    1px solid
    #111111;

}


/* Inner scanner */

#reader {

  width: 100%;

  margin: 0 auto;

  background: #111111;

  overflow: hidden;

}


/* =================================================
   HTML5 QR CODE OVERRIDES
================================================= */

#reader__dashboard_section {

  background: #111111 !important;

}


#reader__scan_region {

  background: #111111 !important;

}


#reader img {

  max-width: 100%;

}


#reader__dashboard {

  padding:
    6px
    8px !important;

}


/* =================================================
   STATUS
================================================= */

#status {

  display: flex;

  align-items: center;

  justify-content: center;

  gap: 10px;

  margin:
    15px
    auto
    0;

  min-height: 34px;

  font-size: 14px;

  font-weight: 500;

  letter-spacing: 1.5px;

  text-transform: uppercase;

}


/* Ready */

#status.ready::before {

  content: "";

  width: 8px;
  height: 8px;

  border-radius: 50%;

  background: #111111;

}


/* Processing */

#status.processing {

  color: #555555;

}


#status.processing::before {

  content: "";

  width: 8px;
  height: 8px;

  border-radius: 50%;

  border:
    1px solid
    #555555;

}


/* Error */

#status.error {

  color: #111111;

}


#status.error::before {

  content: "!";

  display: flex;

  align-items: center;

  justify-content: center;

  width: 18px;
  height: 18px;

  border:
    1px solid
    #111111;

  border-radius: 50%;

  font-size: 12px;

}


/* =================================================
   FOOTER
================================================= */

.footer {

  position: relative;

  z-index: 2;

  padding:
    8px
    20px
    18px;

  font-size: 10px;

  letter-spacing: 3px;

  text-transform: uppercase;

  color: #777777;

}


/* =================================================
   RESULT SCREEN
================================================= */

.result {

  display: none;

  position: fixed;

  inset: 0;

  z-index: 20;

  background:
    rgba(255,255,255,0.97);

  align-items: center;

  justify-content: center;

  padding: 25px;

  overflow: hidden;

}


/* Result watermark */

.result::before {

  content: "";

  position: absolute;

  top: 50%;
  left: 50%;

  width: 850px;
  height: 850px;

  transform:
    translate(-50%, -50%);

  background-image:
    url("logo.png");

  background-repeat: no-repeat;

  background-position: center;

  background-size: contain;

  opacity: 0.035;

  filter: grayscale(100%);

  pointer-events: none;

}


/* =================================================
   RESULT CARD
================================================= */

.resultCard {

  position: relative;

  z-index: 2;

  width: 100%;

  max-width: 560px;

  background: #ffffff;

  border:
    1px solid
    #111111;

}


/* =================================================
   RESULT CONTENT
================================================= */

.resultContent {

  padding:
    50px
    30px
    44px;

}


.resultIcon {

  width: 62px;
  height: 62px;

  margin:
    0 auto
    24px;

  display: flex;

  align-items: center;

  justify-content: center;

  border:
    1px solid
    #111111;

  border-radius: 50%;

  color: #111111;

  font-size: 30px;

  font-weight: 400;

}


.result h1 {

  margin:
    0
    0
    20px;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:
    clamp(28px, 5vw, 40px);

  font-weight: 400;

  letter-spacing: 1px;

}


.result .name {

  font-size:
    clamp(32px, 7vw, 48px);

  font-weight: 600;

  margin:
    0
    18px;

}


.result .message {

  font-size: 17px;

  color: #555555;

  letter-spacing: 0.5px;

  line-height: 1.5;

}


.resultTime {

  font-size: 20px;

  margin-top: 8px;

}


/* =================================================
   RESULT FOOTER
================================================= */

.resultFooter {

  border-top:
    1px solid
    #111111;

  padding:
    15px
    20px;

  font-size: 11px;

  letter-spacing: 2px;

  text-transform: uppercase;

  color: #555555;

}


/* =================================================
   IPAD / TABLET
================================================= */

@media (max-width: 700px) {

  .branding {

    padding:
      25px
      20px
      12px;

  }


  .schoolLogo {

    width: 140px;

    margin-bottom: 12px;

  }


  .brandTitle {

    font-size: 26px;

  }


  .brandSubtitle {

    font-size: 12px;

    letter-spacing: 1.5px;

  }


  .divider {

    margin-top: 16px;

  }


  .container {

    padding:
      10px
      15px
      5px;

  }


  .instruction {

    margin-bottom: 14px;

    font-size: 22px;

  }


  .scannerFrame {

    max-width: 440px;

    padding: 5px;

  }


  .resultContent {

    padding:
      45px
      20px
      40px;

  }

}


/* =================================================
   IPAD LANDSCAPE / LARGE TABLETS
================================================= */

@media (min-width: 701px) and (max-width: 1200px) {

  .branding {

    padding-top: 25px;

  }


  .schoolLogo {

    width: 150px;

  }


  .scannerFrame {

    max-width: 440px;

  }

}


/* =================================================
   SHORT SCREENS
================================================= */

@media (max-height: 700px) {

  .branding {

    padding-top: 16px;

    padding-bottom: 8px;

  }


  .schoolLogo {

    width: 120px;

    margin-bottom: 8px;

  }


  .brandTitle {

    font-size: 24px;

  }


  .brandSubtitle {

    margin-top: 5px;

  }


  .divider {

    margin-top: 10px;

  }


  .container {

    padding-top: 7px;

  }


  .instruction {

    margin-bottom: 10px;

    font-size: 21px;

  }


  .scannerFrame {

    max-width: 420px;

  }


  #status {

    margin-top: 10px;

  }


  .footer {

    padding-bottom: 10px;

  }

}

</style>

</head>


<body>


<div class="page">


  <!-- =============================================
       ROSENBERG BRANDING
  ============================================== -->

  <header class="branding">

    <img
      src="logo.png"
      alt="Institut auf dem Rosenberg"
      class="schoolLogo"
    >


    <h1 class="brandTitle">

      Rosenberg Health &amp; Fitness

    </h1>


    <p class="brandSubtitle">

      Student Check-In / Check-Out

    </p>


    <div class="divider"></div>

  </header>


  <!-- =============================================
       SCANNER
  ============================================== -->

  <main class="container">


    <div id="scannerSection">


      <div class="instruction">

        Scan Your QR Code

      </div>


      <div class="scannerFrame">

        <div id="reader"></div>

      </div>


      <div
        id="status"
        class="ready"
      >

        Ready to scan

      </div>


    </div>


  </main>


  <!-- =============================================
       RESULT SCREEN
  ============================================== -->

  <div
    id="result"
    class="result"
  >

    <div class="resultCard">


      <div class="resultContent">


        <div
          id="resultIcon"
          class="resultIcon"
        >

          ✓

        </div>


        <h1 id="resultTitle"></h1>


        <div
          id="resultName"
          class="name">
        </div>


        <div
          id="resultTime"
          class="resultTime">
        </div>


        <div
          id="resultMessage"
          class="message">
        </div>


      </div>


      <div
        id="resultFooter"
        class="resultFooter"
      >

        Returning to scanner...

      </div>


    </div>

  </div>


  <!-- =============================================
       FOOTER
  ============================================== -->

  <footer class="footer">

    Health &amp; Fitness

  </footer>


</div>


<script>


/*************************************************
 * GOOGLE APPS SCRIPT
 *************************************************/

const APPS_SCRIPT_URL =
  "https://script.google.com/a/macros/instrosenberg.ch/s/AKfycbzZq6AKRHz_6-ab83I6ALVQrsslcyKvlCASxOOOWKjindU6Byg0ZPRdIMGkJ1kk0Kx3/exec";


let scanner = null;

let scanLocked = false;

let requestTimeout = null;


/*************************************************
 * START SCANNER
 *************************************************/

function startScanner() {

  scanner =
    new Html5Qrcode("reader");


  scanner.start(

    /*
     * FRONT CAMERA
     *
     * "user" = front-facing camera
     */

    {
      facingMode: "user"
    },

    {

      /*
       * Scan frequency.
       */

      fps: 10,


      /*
       * Smaller QR detection area.
       */

      qrbox: {
        width: 240,
        height: 240
      }

    },

    function(decodedText) {

      if (scanLocked) {

        return;

      }

      scanLocked = true;

      processQRCode(decodedText);

    },

    function(errorMessage) {

      /*
       * Normal scanning errors
       * are ignored.
       */

    }

  )

  .catch(function(error) {

    console.error(error);

    document.getElementById(
      "status"
    ).textContent =
      "Camera could not be started. Please allow camera access.";

    document.getElementById(
      "status"
    ).className =
      "error";

  });

}



/*************************************************
 * PROCESS QR CODE
 *************************************************/

function processQRCode(studentId) {

  document.getElementById(
    "status"
  ).textContent =
    "Processing...";


  document.getElementById(
    "status"
  ).className =
    "processing";


  /*
   * Pause scanning while processing.
   *
   * The camera remains active.
   */

  try {

    scanner.pause(true);

  }

  catch (error) {

    console.log(error);

  }


  /*
   * Create a unique request ID.
   */

  const requestId =
    "attendance_" +
    Date.now();


  /*
   * Listen for the response from
   * the Apps Script bridge.
   */

  window.addEventListener(
    "message",
    handleAttendanceBridgeMessage
  );


  /*
   * Create hidden iframe.
   *
   * The iframe loads the Apps Script
   * attendance bridge.
   */

  const bridge =
    document.createElement("iframe");


  bridge.id =
    "attendanceBridge";


  bridge.style.display =
    "none";


  bridge.src =
    APPS_SCRIPT_URL +
    "?bridge=1";


  document.body.appendChild(
    bridge
  );


  /*
   * Wait briefly for the bridge
   * to load before sending the request.
   */

  bridge.onload =
    function() {

      try {

        bridge.contentWindow.postMessage(

          {

            type:
              "HNF_ATTENDANCE_SCAN",

            studentId:
              studentId,

            requestId:
              requestId

          },

          "*"

        );

      }

      catch (error) {

        console.error(error);

        cleanupAttendanceBridge();

        showError(
          "Could not connect to the attendance system."
        );

        resumeScanner();

      }

    };


  /*
   * Safety timeout.
   *
   * If the Apps Script bridge does not
   * respond within 10 seconds, reset.
   */

  window.attendanceBridgeTimeout =
    setTimeout(function() {

      cleanupAttendanceBridge();

      showError(
        "The attendance system is taking too long to respond."
      );

      resumeScanner();

    }, 10000);

}


/*************************************************
 * HANDLE BRIDGE RESPONSE
 *************************************************/

function handleAttendanceBridgeMessage(event) {


  /*
   * Only accept messages from the
   * Apps Script domain.
   */

  if (
  !event.origin.includes(
    "googleusercontent.com"
  ) &&
  !event.origin.includes(
    "script.google.com"
  )
) {

  return;

}


  /*
   * Make sure this is our
   * attendance response.
   */

  if (
    !event.data ||
    event.data.type !==
    "HNF_ATTENDANCE_RESULT"
  ) {

    return;

  }


  /*
   * Stop timeout.
   */

  if (
    window.attendanceBridgeTimeout
  ) {

    clearTimeout(
      window.attendanceBridgeTimeout
    );

    window.attendanceBridgeTimeout =
      null;

  }


  /*
   * Remove event listener.
   */

  window.removeEventListener(
    "message",
    handleAttendanceBridgeMessage
  );


  /*
   * Remove hidden iframe.

  */

  cleanupAttendanceBridge();


  /*
   * Get the result.

  */

  let result;


  if (
    event.data.result
  ) {

    result =
      event.data.result;

  }

  else {

    result = {

      success:
        false,

      title:
        event.data.title ||
        "System Error",

      name:
        event.data.name ||
        "",

      message:
        event.data.message ||
        "The attendance system could not process the request."

    };

  }


  /*
   * Show result.

  */

  handleResult(result);

}


/*************************************************
 * CLEAN UP BRIDGE
 *************************************************/

function cleanupAttendanceBridge() {


  /*
   * Remove hidden iframe.
   */

  const bridge =
    document.getElementById(
      "attendanceBridge"
    );


  if (bridge) {

    bridge.remove();

  }


  /*
   * Remove event listener.

   */

  window.removeEventListener(
    "message",
    handleAttendanceBridgeMessage
  );

}


/*************************************************
 * SHOW RESULT
 *************************************************/

function handleResult(result) {


  /*
   * Hide scanner.
   */

  document.getElementById(
    "scannerSection"
  ).style.display =
    "none";


  /*
   * Show result screen.
   */

  const resultElement =
    document.getElementById(
      "result"
    );


  resultElement.style.display =
    "flex";


  /*
   * Populate result.
   */

  document.getElementById(
    "resultTitle"
  ).textContent =
    result.title;


  document.getElementById(
    "resultName"
  ).textContent =
    result.name;


  document.getElementById(
    "resultMessage"
  ).textContent =
    result.message;


  /*
   * Time field remains available
   * for future use.
   */

  document.getElementById(
    "resultTime"
  ).textContent =
    "";


  /*
   * Determine icon.
   */

  const title =
    String(result.title || "")
      .toUpperCase();


  const icon =
    document.getElementById(
      "resultIcon"
    );


  if (
    title.includes("CHECK-IN")
  ) {

    icon.textContent =
      "✓";

  }

  else if (
    title.includes("CHECK-OUT")
  ) {

    icon.textContent =
      "✓";

  }

  else {

    icon.textContent =
      "!";

  }


  /*
   * Countdown.
   */

  let seconds = 3;


  const footer =
    document.getElementById(
      "resultFooter"
    );


  footer.textContent =
    "Returning to scanner in " +
    seconds;


  const countdown =
    setInterval(function() {

      seconds--;


      if (seconds > 0) {

        footer.textContent =
          "Returning to scanner in " +
          seconds;

      }

    }, 1000);


  /*
   * Return to scanner.
   */

  setTimeout(function() {

    clearInterval(countdown);


    resultElement.style.display =
      "none";


    document.getElementById(
      "scannerSection"
    ).style.display =
      "block";


    document.getElementById(
      "status"
    ).textContent =
      "Ready to scan";


    document.getElementById(
      "status"
    ).className =
      "ready";


    resumeScanner();

  }, 3000);

}


/*************************************************
 * RESUME CAMERA
 *************************************************/

function resumeScanner() {

  scanLocked = false;


  try {

    scanner.resume();

  }

  catch (error) {

    console.error(error);

  }

}


/*************************************************
 * ERROR
 *************************************************/

function showError(message) {

  document.getElementById(
    "scannerSection"
  ).style.display =
    "block";


  document.getElementById(
    "result"
  ).style.display =
    "none";


  document.getElementById(
    "status"
  ).textContent =
    message;


  document.getElementById(
    "status"
  ).className =
    "error";

}


/*************************************************
 * START WHEN PAGE LOADS
 *************************************************/

window.addEventListener(
  "load",
  startScanner
);

</script>


</body>

</html>
