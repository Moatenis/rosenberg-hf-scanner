<!DOCTYPE html>
<html>

<head>

  <base target="_top">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    Rosenberg Health & Fitness
  </title>

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {

      margin: 0;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      background: #ffffff;

      color: #111111;

      text-align: center;

    }


    .header {

      padding: 30px 20px 20px;

      border-bottom:
        1px solid #111111;

    }


    .header h1 {

      margin: 0;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 30px;

      font-weight: 400;

      letter-spacing: 1px;

    }


    .header p {

      margin: 8px 0 0;

      font-size: 14px;

      letter-spacing: 2px;

      text-transform: uppercase;

      color: #555555;

    }


    .container {

      width: 100%;

      max-width: 600px;

      margin: 0 auto;

      padding: 25px 20px;

    }


    .instruction {

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 24px;

      margin-bottom: 20px;

    }


    #reader {

      width: 100%;

      max-width: 400px;

      margin: 0 auto;

      background: #111111;

      overflow: hidden;

      border: 5px solid #111111;

    }


    #status {

      margin-top: 18px;

      min-height: 30px;

      font-size: 15px;

      letter-spacing: 1px;

      text-transform: uppercase;

    }


    .ready {

      color: #111111;

    }


    .processing {

      color: #555555;

    }


    .error {

      color: #b00000;

    }


    .result {

      display: none;

      position: fixed;

      inset: 0;

      background: rgba(255,255,255,0.97);

      z-index: 10;

      align-items: center;

      justify-content: center;

      padding: 25px;

    }


    .resultCard {

      width: 100%;

      max-width: 500px;

      border: 1px solid #111111;

      background: #ffffff;

    }


    .resultContent {

      padding: 45px 25px;

    }


    .result h1 {

      margin: 0 0 20px;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 34px;

      font-weight: 400;

    }


    .name {

      font-size: 40px;

      font-weight: 600;

      margin-bottom: 18px;

    }


    .message {

      font-size: 18px;

      color: #555555;

    }


    .resultFooter {

      border-top:
        1px solid #111111;

      padding: 14px;

      font-size: 11px;

      letter-spacing: 2px;

      text-transform: uppercase;

      color: #555555;

    }

  </style>

</head>


<body>


  <div class="header">

    <h1>
      Rosenberg Health &amp; Fitness
    </h1>

    <p>
      Student Check-In / Check-Out
    </p>

  </div>


  <div class="container">

    <div id="scannerSection">

      <div class="instruction">

        Scan Your QR Code

      </div>

      <div id="reader"></div>

      <div
        id="status"
        class="ready"
      >

        Ready to scan

      </div>

    </div>


    <div
      id="result"
      class="result"
    >

      <div class="resultCard">

        <div class="resultContent">

          <h1 id="resultTitle"></h1>

          <div
            id="resultName"
            class="name">
          </div>

          <div
            id="resultMessage"
            class="message">
          </div>

        </div>

        <div
          id="resultFooter"
          class="resultFooter"
        >

          Returning to scanner...

        </div>

      </div>

    </div>

  </div>


<script>


/*************************************************
 * ROSENBERG HEALTH & FITNESS
 * QR SCANNER
 *************************************************/


/*************************************************
 * APPS SCRIPT URL
 *************************************************/

const APPS_SCRIPT_URL =
  "https://script.google.com/a/macros/instrosenberg.ch/s/AKfycbx92HMvs_apPqSTs1MRV3A4FmSm6rocPec8aD9k_y5HeLisnyhu3K1pcCqVAYDon7Zs/exec";


/*************************************************
 * SCANNER
 *************************************************/

let scanner = null;

let scanLocked = false;


/*************************************************
 * START SCANNER
 *************************************************/

function startScanner() {

  scanner =
    new Html5Qrcode("reader");


  scanner.start(

    {
      facingMode: "user"
    },

    {
      fps: 10,

      qrbox: {
        width: 240,
        height: 240
      }

    },

    function(decodedText) {

      if (scanLocked) {

        return;

      }

      scanLocked = true;

      processQRCode(decodedText);

    },

    function(errorMessage) {

      /*
       * Normal QR scanning errors
       * are ignored.
       */

    }

  )

  .catch(function(error) {

    console.error(error);

    showError(
      "Camera could not be started."
    );

  });

}


/*************************************************
 * PROCESS QR CODE
 *************************************************/

function processQRCode(studentId) {

  document.getElementById(
    "status"
  ).textContent =
    "Processing...";


  document.getElementById(
    "status"
  ).className =
    "processing";


  /*
   * Pause scanner while processing.
   */

  try {

    scanner.pause(true);

  }

  catch (error) {

    console.log(error);

  }


  /*
   * Send attendance request directly
   * through Apps Script.
   */

  google.script.run

    .withSuccessHandler(
      function(result) {

        /*
         * Attendance has been saved.
         *
         * Show the result immediately.
         */

        handleResult(result);


        /*
         * Send the House notification
         * separately in the background.
         *
         * This request does NOT use
         * google.script.run.
         */

        if (
          result &&
          result.success
        ) {

          sendHouseNotification(
            studentId,
            result.action,
            Date.now()
          );

        }

      }
    )

    .withFailureHandler(
      function(error) {

        console.error(error);

        showError(
          "Could not connect to the attendance system."
        );

        resumeScanner();

      }
    )

    .scannerCheckInOut(
      studentId
    );

}


/*************************************************
 * SEND HOUSE NOTIFICATION
 *************************************************/

function sendHouseNotification(
  studentId,
  action,
  timestamp
) {

  /*
   * Build the notification URL.
   */

  const url =
    APPS_SCRIPT_URL +
    "?notification=1" +
    "&id=" +
    encodeURIComponent(studentId) +
    "&action=" +
    encodeURIComponent(action) +
    "&timestamp=" +
    encodeURIComponent(timestamp) +
    "&_=" +
    Date.now();


  /*
   * Create an invisible image.
   *
   * The browser makes the request
   * without navigating away from the scanner.
   */

  const img =
    new Image();


  /*
   * The response itself is not important.
   *
   * Apps Script receives the request
   * and sends the House email.
   */

  img.onload =
    function() {

      console.log(
        "House notification request completed."
      );

    };


  img.onerror =
    function() {

      console.log(
        "House notification request sent."
      );

    };


  /*
   * Start the request.
   */

  img.src = url;

}


/*************************************************
 * SHOW RESULT
 *************************************************/

function handleResult(result) {

  document.getElementById(
    "scannerSection"
  ).style.display =
    "none";


  const resultElement =
    document.getElementById(
      "result"
    );


  resultElement.style.display =
    "flex";


  document.getElementById(
    "resultTitle"
  ).textContent =
    result.title || "";


  document.getElementById(
    "resultName"
  ).textContent =
    result.name || "";


  document.getElementById(
    "resultMessage"
  ).textContent =
    result.message || "";


  setTimeout(

    function() {

      resultElement.style.display =
        "none";


      document.getElementById(
        "scannerSection"
      ).style.display =
        "block";


      document.getElementById(
        "status"
      ).textContent =
        "Ready to scan";


      document.getElementById(
        "status"
      ).className =
        "ready";


      resumeScanner();

    },

    3000

  );

}


/*************************************************
 * RESUME SCANNER
 *************************************************/

function resumeScanner() {

  scanLocked = false;


  try {

    scanner.resume();

  }

  catch (error) {

    console.error(error);

  }

}


/*************************************************
 * ERROR
 *************************************************/

function showError(message) {

  document.getElementById(
    "scannerSection"
  ).style.display =
    "block";


  document.getElementById(
    "result"
  ).style.display =
    "none";


  document.getElementById(
    "status"
  ).textContent =
    message;


  document.getElementById(
    "status"
  ).className =
    "error";

}


/*************************************************
 * START
 *************************************************/

window.addEventListener(
  "load",
  startScanner
);


</script>


</body>

</html>
