<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Rosenberg Health & Fitness</title>

  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #ffffff;
      color: #111111;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    /* ROSENBERG WATERMARK */
    .watermark {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 560px;
      height: 560px;
      object-fit: contain;
      transform: translate(-50%, -50%);
      opacity: 0.105;
      z-index: 0;
      pointer-events: none;
      user-select: none;
    }

    /* MAIN PAGE */
    .page {
      width: 100%;
      max-width: 620px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 1;
    }

    /* HEADER */
    .header {
      padding: 34px 25px 22px;
      border-bottom: 1px solid rgba(17, 17, 17, 0.75);
      text-align: center;
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
    }

    .brand {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 30px;
      font-weight: 400;
      letter-spacing: 1px;
      margin: 0;
      white-space: nowrap;
    }

    .subtitle {
      margin-top: 8px;
      font-size: 13px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: #555555;
      white-space: nowrap;
    }

    /* MAIN */
    .main {
      flex: 1;
      padding: 35px 25px 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: transparent;
    }

    .instruction {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 27px;
      text-align: center;
      margin-bottom: 25px;
      background: rgba(255, 255, 255, 0.62);
      padding: 4px 14px;
    }

    /* CODE DISPLAY */
    .codeDisplay {
      width: 100%;
      max-width: 390px;
      height: 75px;
      border: 1px solid rgba(17, 17, 17, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 38px;
      letter-spacing: 8px;
      margin-bottom: 25px;
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
    }

    .placeholder {
      color: #888888;
      font-size: 18px;
      letter-spacing: 2px;
    }

    /* KEYPAD */
    .keypad {
      width: 100%;
      max-width: 390px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .key {
      height: 78px;
      border: 1px solid rgba(17, 17, 17, 0.82);
      background: rgba(255, 255, 255, 0.68);
      color: #111111;
      font-size: 28px;
      font-weight: 400;
      cursor: pointer;
      touch-action: manipulation;
      backdrop-filter: blur(1.5px);
      -webkit-backdrop-filter: blur(1.5px);
      transition: background 0.12s ease, color 0.12s ease, transform 0.08s ease;
    }

    .key:active {
      background: rgba(17, 17, 17, 0.86);
      color: #ffffff;
      transform: scale(0.985);
    }

    .key.action {
      font-size: 19px;
      letter-spacing: 1px;
    }

    .key.clear {
      font-size: 18px;
      color: #333333;
    }

    .key.submit {
      background: rgba(17, 17, 17, 0.86);
      color: #ffffff;
      font-size: 18px;
      letter-spacing: 1px;
      backdrop-filter: blur(1.5px);
      -webkit-backdrop-filter: blur(1.5px);
    }

    .key.submit:active {
      background: rgba(51, 51, 51, 0.94);
    }

    /* STATUS */
    .status {
      min-height: 30px;
      width: 100%;
      margin-top: 20px;
      text-align: center;
      font-size: 14px;
      letter-spacing: 1px;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: visible;
      background: rgba(255, 255, 255, 0.58);
      padding: 4px 8px;
    }

    .status.ready,
    .status.processing {
      color: #555555;
    }

    .status.error {
      color: #9d0000;
    }

    /* RESULT SCREEN */
    .result {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(255, 255, 255, 0.94);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 25px;
    }

    .resultCard {
      width: 100%;
      max-width: 500px;
      border: 1px solid #111111;
      text-align: center;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    .resultContent {
      padding: 55px 25px;
    }

    .resultTitle {
      margin: 0 0 25px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 38px;
      font-weight: 400;
      letter-spacing: 1px;
    }

    .resultName {
      font-size: 40px;
      font-weight: 600;
      line-height: 1.15;
      margin-bottom: 20px;
    }

    .resultMessage {
      font-size: 18px;
      color: #555555;
      line-height: 1.5;
    }

    .resultFooter {
      border-top: 1px solid #111111;
      padding: 14px;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #555555;
    }

    /* FOOTER */
    .footer {
      padding: 18px;
      text-align: center;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #777777;
      background: rgba(255, 255, 255, 0.62);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
    }

    /* MOBILE / IPAD */
    @media (max-width: 600px) {
      .header {
        padding-top: 25px;
      }

      .brand {
        font-size: 26px;
      }

      .instruction {
        font-size: 25px;
      }

      .key {
        height: 72px;
      }

      .watermark {
        width: 470px;
        height: 470px;
        opacity: 0.10;
      }

      .status {
        font-size: 10px;
        letter-spacing: 0.5px;
      }
    }

    /* VERY SMALL SCREENS */
    @media (max-width: 420px) {
      .brand {
        font-size: 23px;
      }

      .subtitle {
        font-size: 10px;
        letter-spacing: 1.8px;
      }

      .instruction {
        font-size: 23px;
      }

      .codeDisplay {
        height: 70px;
      }

      .key {
        height: 68px;
      }

      .watermark {
        width: 390px;
        height: 390px;
        opacity: 0.095;
      }
    }

  </style>

</head>


<body>


  <!-- =========================================
       ROSENBERG BACKGROUND WATERMARK
       ========================================== -->

  <img
    src="logo.png"
    alt=""
    class="watermark"
  >


  <div class="page">


    <!-- =======================================
         HEADER
         ======================================== -->

    <header class="header">

      <h1 class="brand">

        Rosenberg Health &amp; Fitness

      </h1>


      <div class="subtitle">

        Student Check-In / Check-Out

      </div>

    </header>


    <!-- =======================================
         MAIN
         ======================================== -->

    <main class="main">


      <div class="instruction">

        Enter Your Student Code

      </div>


      <div
        id="codeDisplay"
        class="codeDisplay"
      >

        <span
          id="placeholder"
          class="placeholder"
        >

          Student Code

        </span>


        <span
          id="codeText"
          style="display:none;"
        ></span>

      </div>


      <!-- =====================================
           KEYPAD
           ====================================== -->

      <div class="keypad">


        <button
          class="key"
          onclick="addDigit('1')"
        >

          1

        </button>


        <button
          class="key"
          onclick="addDigit('2')"
        >

          2

        </button>


        <button
          class="key"
          onclick="addDigit('3')"
        >

          3

        </button>


        <button
          class="key"
          onclick="addDigit('4')"
        >

          4

        </button>


        <button
          class="key"
          onclick="addDigit('5')"
        >

          5

        </button>


        <button
          class="key"
          onclick="addDigit('6')"
        >

          6

        </button>


        <button
          class="key"
          onclick="addDigit('7')"
        >

          7

        </button>


        <button
          class="key"
          onclick="addDigit('8')"
        >

          8

        </button>


        <button
          class="key"
          onclick="addDigit('9')"
        >

          9

        </button>


        <button
          class="key action clear"
          onclick="clearCode()"
        >

          CLEAR

        </button>


        <button
          class="key"
          onclick="addDigit('0')"
        >

          0

        </button>


        <button
          class="key submit"
          onclick="submitCode()"
        >

          ENTER

        </button>


      </div>


      <div
        id="status"
        class="status ready"
      >

        Ready

      </div>


    </main>


    <!-- =======================================
         FOOTER
         ======================================== -->

    <div class="footer">

      Institut auf dem Rosenberg

    </div>


  </div>


  <!-- =========================================
       RESULT SCREEN
       ========================================== -->

  <div
    id="result"
    class="result"
  >


    <div class="resultCard">


      <div class="resultContent">


        <h1
          id="resultTitle"
          class="resultTitle"
        ></h1>


        <div
          id="resultName"
          class="resultName"
        ></div>


        <div
          id="resultMessage"
          class="resultMessage"
        ></div>


      </div>


      <div class="resultFooter">

        Returning to check-in...

      </div>


    </div>


  </div>


  <script>


    /*************************************************
     * CONFIGURATION
     *************************************************/


    const APPS_SCRIPT_URL =

      "https://script.google.com/a/macros/instrosenberg.ch/s/AKfycbyNZ1oONCoA8Ub0L4ceoAhYry0xEdx_DId7n3yolkM7xgLyMCSseMAGNTyZrb7MChEfLw/exec";


    /*************************************************
     * STATE
     *************************************************/


    let studentCode = "";

    let locked = false;


    /*************************************************
     * UPDATE DISPLAY
     *************************************************/


    function updateDisplay() {


      const placeholder =

        document.getElementById(
          "placeholder"
        );


      const codeText =

        document.getElementById(
          "codeText"
        );


      if (

        studentCode.length === 0

      ) {


        placeholder.style.display =

          "inline";


        codeText.style.display =

          "none";


        codeText.textContent =

          "";


        return;

      }


      placeholder.style.display =

        "none";


      codeText.style.display =

        "inline";


      codeText.textContent =

        studentCode;

    }


    /*************************************************
     * ADD DIGIT
     *************************************************/


    function addDigit(

      digit

    ) {


      if (locked) {

        return;

      }


      /*
       * Maximum 2 digits.
       *
       * Student codes currently use
       * values such as 1–80.
       */

      if (

        studentCode.length >= 2

      ) {

        return;

      }


      studentCode +=

        digit;


      updateDisplay();


      /*
       * We intentionally do NOT
       * automatically submit here.
       *
       * The student presses ENTER.
       */

    }


    /*************************************************
     * CLEAR
     *************************************************/


    function clearCode() {


      if (locked) {

        return;

      }


      studentCode = "";


      updateDisplay();


      setStatus(

        "Ready",

        "ready"

      );

    }


    /*************************************************
     * SUBMIT
     *************************************************/


    function submitCode() {


      if (locked) {

        return;

      }


      if (

        studentCode === ""

      ) {


        setStatus(

          "Please enter your student code.",

          "error"

        );


        return;

      }


      locked = true;


      setStatus(

        "Processing...",

        "processing"

      );


      callAttendanceSystem(

        studentCode

      );

    }


    /*************************************************
     * CALL APPS SCRIPT
     *************************************************/


    function callAttendanceSystem(

      code

    ) {


      /*
       * JSONP is used because this
       * page is hosted on GitHub Pages
       * and Apps Script is hosted
       * on Google's domain.
       */


      const callbackName =

        "attendanceCallback_" +

        Date.now();


      window[callbackName] =

        function(result) {


          try {


            handleResult(

              result

            );


          }


          finally {


            delete window[

              callbackName

            ];

          }


        };


      const script =

        document.createElement(

          "script"

        );


      const separator =

        APPS_SCRIPT_URL

          .includes("?")

          ? "&"

          : "?";


      script.src =

        APPS_SCRIPT_URL +

        separator +

        "code=" +

        encodeURIComponent(

          code

        ) +

        "&callback=" +

        callbackName;


      script.onerror =

        function() {


          delete window[

            callbackName

          ];


          showError(

            "Could not connect to the attendance system."

          );


        };


      document.body.appendChild(

        script

      );

    }


    /*************************************************
     * HANDLE RESULT
     *************************************************/


    function handleResult(

      result

    ) {


      if (

        !result ||

        result.success !== true

      ) {


        showError(

          result &&

          result.message

            ? result.message

            : "Student not found."

        );


        return;

      }


      /*
       * Hide main interface.
       */

      document.querySelector(

        ".main"

      ).style.display =

        "none";


      /*
       * Show result.
       */

      const resultElement =

        document.getElementById(

          "result"

        );


      resultElement.style.display =

        "flex";


      document.getElementById(

        "resultTitle"

      ).textContent =

        result.title || "";


      document.getElementById(

        "resultName"

      ).textContent =

        result.name || "";


      document.getElementById(

        "resultMessage"

      ).textContent =

        result.message || "";


      /*
       * Return to scanner
       * after 3 seconds.
       */

      setTimeout(

        function() {


          resetInterface();


        },

        3000

      );

    }


    /*************************************************
     * ERROR
     *************************************************/


    function showError(

      message

    ) {


      setStatus(

        message,

        "error"

      );


      locked = false;

    }


    /*************************************************
     * STATUS
     *************************************************/


    function setStatus(

      message,

      type

    ) {


      const status =

        document.getElementById(

          "status"

        );


      status.textContent =

        message;


      status.className =

        "status " +

        type;

    }


    /*************************************************
     * RESET
     *************************************************/


    function resetInterface() {


      document.getElementById(

        "result"

      ).style.display =

        "none";


      document.querySelector(

        ".main"

      ).style.display =

        "flex";


      studentCode = "";


      locked = false;


      updateDisplay();


      setStatus(

        "Ready",

        "ready"

      );

    }


    /*************************************************
     * KEYBOARD SUPPORT
     *************************************************/


    document.addEventListener(

      "keydown",

      function(event) {


        if (locked) {

          return;

        }


        /*
         * Number keys.
         */

        if (

          /^[0-9]$/.test(

            event.key

          )

        ) {


          addDigit(

            event.key

          );


          return;

        }


        /*
         * Enter.
         */

        if (

          event.key === "Enter"

        ) {


          submitCode();


          return;

        }


        /*
         * Backspace.
         */

        if (

          event.key === "Backspace"

        ) {


          studentCode =

            studentCode.slice(

              0,

              -1

            );


          updateDisplay();

        }


        /*
         * Escape = clear.
         */

        if (

          event.key === "Escape"

        ) {


          clearCode();

        }

      }

    );


  </script>


</body>

</html>
