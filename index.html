<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>
Rosenberg Health & Fitness
</title>


<script
  src="https://unpkg.com/html5-qrcode"
  type="text/javascript">
</script>


<style>

* {
  box-sizing: border-box;
}


html,
body {

  margin: 0;

  padding: 0;

  width: 100%;

  min-height: 100%;

  background: #ffffff;

  color: #111111;

}


body {

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;

  text-align: center;

  -webkit-font-smoothing: antialiased;

}


/* =========================================================
   HEADER
   ========================================================= */

.header {

  padding:
    26px
    20px
    20px;

  border-bottom:
    1px solid #111111;

}


.header h1 {

  margin: 0;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size: 30px;

  font-weight: 400;

  letter-spacing: 1px;

}


.header p {

  margin:
    8px
    0
    0;

  font-size: 14px;

  letter-spacing: 2px;

  text-transform: uppercase;

  color: #555555;

}


/* =========================================================
   MAIN CONTAINER
   ========================================================= */

.container {

  width: 100%;

  max-width: 600px;

  margin: 0 auto;

  padding:
    24px
    20px
    30px;

}


.instruction {

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size: 25px;

  margin:
    0
    0
    20px;

}


/* =========================================================
   QR READER
   ========================================================= */

#reader {

  width: 100%;

  max-width: 330px;

  margin: 0 auto;

  background: #111111;

  overflow: hidden;

  border:
    2px
    solid
    #111111;

}


#reader video {

  width: 100% !important;

  height: auto !important;

  max-height: 330px;

  object-fit: cover;

  display: block;

}


#reader__scan_region {

  min-height: 0 !important;

}


#reader__dashboard {

  display: none !important;

}


#reader__status_span {

  display: none !important;

}


/* =========================================================
   STATUS
   ========================================================= */

#status {

  margin-top: 16px;

  min-height: 28px;

  font-size: 14px;

  letter-spacing: 1.4px;

  text-transform: uppercase;

}


.ready {

  color: #111111;

}


.processing {

  color: #555555;

}


.error {

  color: #b00000;

}


.success {

  color: #111111;

}


/* =========================================================
   RESULT
   ========================================================= */

.result {

  display: none;

  position: fixed;

  inset: 0;

  background:
    rgba(
      255,
      255,
      255,
      0.98
    );

  z-index: 1000;

  align-items: center;

  justify-content: center;

  padding: 25px;

}


.resultCard {

  width: 100%;

  max-width: 500px;

  border:
    1px solid
    #111111;

  background: #ffffff;

}


.resultContent {

  padding:
    45px
    25px;

}


.result h1 {

  margin:
    0
    0
    20px;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size: 34px;

  font-weight: 400;

}


.name {

  font-size: 40px;

  font-weight: 600;

  margin-bottom: 18px;

}


.message {

  font-size: 18px;

  color: #555555;

}


.resultFooter {

  border-top:
    1px solid
    #111111;

  padding: 14px;

  font-size: 11px;

  letter-spacing: 2px;

  text-transform: uppercase;

  color: #555555;

}


/* =========================================================
   MOBILE / iPAD
   ========================================================= */

@media (max-width: 700px) {

  .header {

    padding:
      22px
      15px
      16px;

  }


  .header h1 {

    font-size: 25px;

  }


  .header p {

    font-size: 12px;

    letter-spacing: 1.5px;

  }


  .container {

    padding:
      20px
      14px
      25px;

  }


  .instruction {

    font-size: 23px;

    margin-bottom: 16px;

  }


  #reader {

    max-width: 330px;

  }


  #reader video {

    max-height: 330px;

  }

}

</style>

</head>


<body>


<div class="header">

  <h1>
    Rosenberg Health &amp; Fitness
  </h1>

  <p>
    Student Check-In / Check-Out
  </p>

</div>


<div class="container">


  <div id="scannerSection">

    <div class="instruction">

      Scan Your QR Code

    </div>


    <div id="reader"></div>


    <div
      id="status"
      class="ready"
    >

      Ready to scan

    </div>

  </div>


  <div
    id="result"
    class="result"
  >

    <div class="resultCard">

      <div class="resultContent">

        <h1 id="resultTitle"></h1>

        <div
          id="resultName"
          class="name">
        </div>

        <div
          id="resultMessage"
          class="message">
        </div>

      </div>

      <div
        class="resultFooter"
      >

        Returning to scanner...

      </div>

    </div>

  </div>

</div>


<script>


/* =========================================================
   CONFIGURATION
   ========================================================= */


const ATTENDANCE_ENDPOINT =
  "https://script.google.com/a/macros/instrosenberg.ch/s/AKfycbx92HMvs_apPqSTs1MRV3A4FmSm6rocPec8aD9k_y5HeLisnyhu3K1pcCqVAYDon7Zs/exec";


const QR_BOX_SIZE =
  220;


const SCAN_FPS =
  10;


const ATTENDANCE_TIMEOUT =
  15000;


/* =========================================================
   GLOBALS
   ========================================================= */

let scanner = null;

let scanLocked = false;

let requestCounter = 0;


/* =========================================================
   START SCANNER
   ========================================================= */

function startScanner() {

  scanner =
    new Html5Qrcode(
      "reader"
    );


  scanner.start(

    /*
     * FRONT CAMERA
     */

    {
      facingMode: "user"
    },


    {

      fps:
        SCAN_FPS,

      qrbox: {

        width:
          QR_BOX_SIZE,

        height:
          QR_BOX_SIZE

      },

      aspectRatio:
        1.0

    },


    function(decodedText) {

      if (scanLocked) {

        return;

      }


      scanLocked =
        true;


      processQRCode(
        decodedText
      );

    },


    function(errorMessage) {

      /*
       * Normal QR scanning errors
       * are ignored.
       */

    }

  )

  .catch(
    function(error) {

      console.error(
        "Camera error:",
        error
      );


      showError(
        "Camera could not be started."
      );

    }
  );

}


/* =========================================================
   PROCESS QR CODE
   ========================================================= */

function processQRCode(
  studentId
) {

  setStatus(
    "Processing...",
    "processing"
  );


  try {

    if (scanner) {

      scanner.pause(
        true
      );

    }

  }

  catch (error) {

    console.warn(
      "Could not pause scanner:",
      error
    );

  }


  sendAttendanceRequest(
    studentId
  );

}


/* =========================================================
   SEND ATTENDANCE REQUEST
   ========================================================= */

function sendAttendanceRequest(
  studentId
) {

  requestCounter++;


  const callbackName =
    "attendanceCallback_" +
    requestCounter;


  let completed =
    false;


  let timeoutId =
    null;


  let script =
    null;


  /*
   * Store the student ID.
   *
   * We will use this later if we need
   * the notification request.
   */

  window.lastScannedStudentId =
    String(
      studentId
    ).trim();


  /*
   * JSONP callback.
   */

  window[callbackName] =
    function(result) {

      if (completed) {

        return;

      }


      completed =
        true;


      clearTimeout(
        timeoutId
      );


      cleanupJSONP(
        script,
        callbackName
      );


      handleAttendanceResult(
        result
      );

    };


  /*
   * Build Apps Script URL.
   */

  const url =
    ATTENDANCE_ENDPOINT +
    "?id=" +
    encodeURIComponent(
      String(
        studentId
      ).trim()
    ) +
    "&callback=" +
    encodeURIComponent(
      callbackName
    ) +
    "&_=" +
    Date.now();


  console.log(
    "Attendance request:",
    url
  );


  /*
   * Create JSONP script.
   */

  script =
    document.createElement(
      "script"
    );


  script.src =
    url;


  script.async =
    true;


  /*
   * Request failed.
   */

  script.onerror =
    function(error) {

      if (completed) {

        return;

      }


      completed =
        true;


      clearTimeout(
        timeoutId
      );


      cleanupJSONP(
        script,
        callbackName
      );


      console.error(
        "Attendance endpoint error:",
        error
      );


      showError(
        "Could not connect to the attendance system."
      );


      resumeScanner();

    };


  /*
   * Add request to page.
   */

  document.body.appendChild(
    script
  );


  /*
   * Timeout.
   */

  timeoutId =
    setTimeout(
      function() {

        if (completed) {

          return;

        }


        completed =
          true;


        cleanupJSONP(
          script,
          callbackName
        );


        console.error(
          "Attendance request timed out."
        );


        showError(
          "The attendance system is taking too long to respond."
        );


        resumeScanner();

      },
      ATTENDANCE_TIMEOUT
    );

}


/* =========================================================
   CLEAN UP JSONP
   ========================================================= */

function cleanupJSONP(
  script,
  callbackName
) {

  try {

    if (
      script &&
      script.parentNode
    ) {

      script.parentNode.removeChild(
        script
      );

    }

  }

  catch (error) {

    console.warn(
      "Could not remove JSONP script:",
      error
    );

  }


  try {

    delete window[
      callbackName
    ];

  }

  catch (error) {

    window[
      callbackName
    ] = undefined;

  }

}


/* =========================================================
   HANDLE RESULT
   ========================================================= */

function handleAttendanceResult(
  result
) {

  console.log(
    "Attendance response:",
    result
  );


  if (
    !result ||
    typeof result !== "object"
  ) {

    showError(
      "Invalid response from the attendance system."
    );


    resumeScanner();

    return;

  }


  if (
    result.success === false
  ) {

    showResult(

      result.title ||
        "Unable to check in/out",

      result.name ||
        "",

      result.message ||
        "Please try again."

    );


    return;

  }


  if (
    result.success === true
  ) {

    showResult(

      result.title ||
        "",

      result.name ||
        "",

      result.message ||
        ""

    );


    return;

  }


  showError(
    "Unexpected response from the attendance system."
  );


  resumeScanner();

}


/* =========================================================
   SHOW RESULT
   ========================================================= */

function showResult(
  title,
  name,
  message
) {

  document.getElementById(
    "scannerSection"
  ).style.display =
    "none";


  const resultElement =
    document.getElementById(
      "result"
    );


  resultElement.style.display =
    "flex";


  document.getElementById(
    "resultTitle"
  ).textContent =
    title ||
    "";


  document.getElementById(
    "resultName"
  ).textContent =
    name ||
    "";


  document.getElementById(
    "resultMessage"
  ).textContent =
    message ||
    "";


  setTimeout(
    function() {

      resultElement.style.display =
        "none";


      document.getElementById(
        "scannerSection"
      ).style.display =
        "block";


      setStatus(
        "Ready to scan",
        "ready"
      );


      resumeScanner();

    },
    3000
  );

}


/* =========================================================
   STATUS
   ========================================================= */

function setStatus(
  message,
  className
) {

  const status =
    document.getElementById(
      "status"
    );


  status.textContent =
    message;


  status.className =
    className ||
    "ready";

}


/* =========================================================
   ERROR
   ========================================================= */

function showError(
  message
) {

  document.getElementById(
    "scannerSection"
  ).style.display =
    "block";


  document.getElementById(
    "result"
  ).style.display =
    "none";


  setStatus(
    message,
    "error"
  );

}


/* =========================================================
   RESUME SCANNER
   ========================================================= */

function resumeScanner() {

  scanLocked =
    false;


  try {

    if (scanner) {

      scanner.resume();

    }

  }

  catch (error) {

    console.warn(
      "Could not resume scanner:",
      error
    );

  }

}


/* =========================================================
   START
   ========================================================= */

window.addEventListener(
  "load",
  function() {

    startScanner();

  }
);


</script>


</body>

</html>
