<!DOCTYPE html>
<html>

<head>

  <base target="_top">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    Rosenberg Health & Fitness
  </title>

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>

  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      background: #ffffff;

      color: #111111;

      text-align: center;

    }


    .header {

      padding:
        30px 20px 20px;

      border-bottom:
        1px solid #111111;

    }


    .header h1 {

      margin: 0;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 30px;

      font-weight: 400;

      letter-spacing: 1px;

    }


    .header p {

      margin:
        8px 0 0;

      font-size: 14px;

      letter-spacing: 2px;

      text-transform: uppercase;

      color: #555555;

    }


    .container {

      width: 100%;

      max-width: 600px;

      margin: 0 auto;

      padding:
        25px 20px;

    }


    .instruction {

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 24px;

      margin-bottom: 20px;

    }


    #reader {

      width: 100%;

      max-width: 330px;

      margin: 0 auto;

      background: #111111;

      overflow: hidden;

      border:
        2px solid #111111;

    }


    #reader video {

      width: 100% !important;

      height: auto !important;

      display: block;

    }


    #status {

      margin-top: 18px;

      min-height: 30px;

      font-size: 15px;

      letter-spacing: 1px;

      text-transform: uppercase;

    }


    .ready {

      color: #111111;

    }


    .processing {

      color: #555555;

    }


    .error {

      color: #b00000;

    }


    .result {

      display: none;

      position: fixed;

      inset: 0;

      background:
        rgba(
          255,
          255,
          255,
          0.97
        );

      z-index: 10;

      align-items: center;

      justify-content: center;

      padding: 25px;

    }


    .resultCard {

      width: 100%;

      max-width: 500px;

      border:
        1px solid #111111;

      background: #ffffff;

    }


    .resultContent {

      padding:
        45px 25px;

    }


    .result h1 {

      margin:
        0 0 20px;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 34px;

      font-weight: 400;

    }


    .name {

      font-size: 40px;

      font-weight: 600;

      margin-bottom: 18px;

    }


    .message {

      font-size: 18px;

      color: #555555;

    }


    .resultFooter {

      border-top:
        1px solid #111111;

      padding: 14px;

      font-size: 11px;

      letter-spacing: 2px;

      text-transform: uppercase;

      color: #555555;

    }


    @media (max-width: 700px) {

      .header {

        padding:
          22px 15px 16px;

      }


      .header h1 {

        font-size: 25px;

      }


      .header p {

        font-size: 12px;

        letter-spacing: 1.5px;

      }


      .container {

        padding:
          20px 14px 25px;

      }


      .instruction {

        font-size: 23px;

        margin-bottom: 16px;

      }


      #reader {

        max-width: 330px;

      }

    }

  </style>

</head>


<body>


  <div class="header">

    <h1>
      Rosenberg Health &amp; Fitness
    </h1>

    <p>
      Student Check-In / Check-Out
    </p>

  </div>


  <div class="container">


    <div id="scannerSection">


      <div class="instruction">

        Scan Your QR Code

      </div>


      <div id="reader"></div>


      <div
        id="status"
        class="ready"
      >

        Ready to scan

      </div>


    </div>


    <div
      id="result"
      class="result"
    >


      <div class="resultCard">


        <div class="resultContent">


          <h1 id="resultTitle"></h1>


          <div
            id="resultName"
            class="name">
          </div>


          <div
            id="resultMessage"
            class="message">
          </div>


        </div>


        <div
          id="resultFooter"
          class="resultFooter"
        >

          Returning to scanner...

        </div>


      </div>


    </div>


  </div>


<script>


/*************************************************
 * CONFIGURATION
 *************************************************/


const APPS_SCRIPT_URL =
  "https://script.google.com/a/macros/instrosenberg.ch/s/AKfycbx92HMvs_apPqSTs1MRV3A4FmSm6rocPec8aD9k_y5HeLisnyhu3K1pcCqVAYDon7Zs/exec";


const QR_BOX_SIZE = 220;


const SCAN_FPS = 10;


const ATTENDANCE_TIMEOUT = 15000;


/*************************************************
 * GLOBAL VARIABLES
 *************************************************/


let scanner = null;


let scanLocked = false;


let requestCounter = 0;


/*************************************************
 * START SCANNER
 *************************************************/


function startScanner() {


  scanner =
    new Html5Qrcode(
      "reader"
    );


  scanner.start(


    {
      facingMode: "user"
    },


    {

      fps:
        SCAN_FPS,

      qrbox: {

        width:
          QR_BOX_SIZE,

        height:
          QR_BOX_SIZE

      },

      aspectRatio: 1.0

    },


    function(decodedText) {


      if (scanLocked) {

        return;

      }


      scanLocked =
        true;


      processQRCode(
        decodedText
      );


    },


    function(errorMessage) {

      /*
       * Normal QR scanning errors
       * are ignored.
       */

    }


  )


  .catch(
    function(error) {


      console.error(
        "Camera error:",
        error
      );


      showError(
        "Camera could not be started."
      );


    }
  );

}


/*************************************************
 * PROCESS QR CODE
 *************************************************/


function processQRCode(
  studentId
) {


  setStatus(
    "Processing...",
    "processing"
  );


  try {


    if (scanner) {

      scanner.pause(true);

    }


  }

  catch (error) {


    console.warn(
      "Could not pause scanner:",
      error
    );


  }


  /*
   * IMPORTANT:
   *
   * The GitHub scanner cannot use
   * google.script.run.
   *
   * We therefore use JSONP to communicate
   * with the Apps Script web app.
   */

  sendAttendanceRequest(
    studentId
  );

}


/*************************************************
 * SEND ATTENDANCE REQUEST
 *************************************************/


function sendAttendanceRequest(
  studentId
) {


  requestCounter++;


  const callbackName =
    "attendanceCallback_" +
    requestCounter;


  let completed =
    false;


  let timeoutId =
    null;


  let script =
    null;


  /*
   * Create the JSONP callback.
   */

  window[callbackName] =
    function(result) {


      if (completed) {

        return;

      }


      completed =
        true;


      clearTimeout(
        timeoutId
      );


      cleanupJSONP(
        script,
        callbackName
      );


      handleAttendanceResult(
        result,
        studentId
      );


    };


  /*
   * Build the Apps Script URL.
   */

  const url =
    APPS_SCRIPT_URL +
    "?id=" +
    encodeURIComponent(
      String(
        studentId
      ).trim()
    ) +
    "&callback=" +
    encodeURIComponent(
      callbackName
    ) +
    "&_=" +
    Date.now();


  console.log(
    "Attendance request:",
    url
  );


  /*
   * Create script element.
   */

  script =
    document.createElement(
      "script"
    );


  script.src =
    url;


  script.async =
    true;


  /*
   * If the browser cannot load
   * the Apps Script endpoint.
   */

  script.onerror =
    function(error) {


      if (completed) {

        return;

      }


      completed =
        true;


      clearTimeout(
        timeoutId
      );


      cleanupJSONP(
        script,
        callbackName
      );


      console.error(
        "Attendance endpoint error:",
        error
      );


      showError(
        "Could not connect to the attendance system."
      );


      resumeScanner();


    };


  /*
   * Add the request to the page.
   */

  document.body.appendChild(
    script
  );


  /*
   * Safety timeout.
   */

  timeoutId =
    setTimeout(
      function() {


        if (completed) {

          return;

        }


        completed =
          true;


        cleanupJSONP(
          script,
          callbackName
        );


        console.error(
          "Attendance request timed out."
        );


        showError(
          "The attendance system is taking too long to respond."
        );


        resumeScanner();


      },
      ATTENDANCE_TIMEOUT
    );

}


/*************************************************
 * HANDLE ATTENDANCE RESULT
 *************************************************/


function handleAttendanceResult(
  result,
  studentId
) {


  console.log(
    "Attendance response:",
    result
  );


  if (
    !result ||
    typeof result !== "object"
  ) {


    showError(
      "Invalid response from the attendance system."
    );


    resumeScanner();


    return;

  }


  /*
   * Attendance failed.
   */

  if (
    result.success === false
  ) {


    showResult(

      result.title ||
        "Unable to check in/out",

      result.name ||
        "",

      result.message ||
        "Please try again."

    );


    return;

  }


  /*
   * Attendance succeeded.
   */

  if (
    result.success === true
  ) {


    /*
     * Show the result immediately.
     */

    showResult(

      result.title ||
        "",

      result.name ||
        "",

      result.message ||
        ""

    );


    /*
     * Send the House email separately.
     *
     * This does NOT delay the result.
     */

    sendHouseNotification(

      studentId,

      result.action,

      Date.now()

    );


    return;

  }


  showError(
    "Unexpected response from the attendance system."
  );


  resumeScanner();

}


/*************************************************
 * SEND HOUSE NOTIFICATION
 *************************************************/


function sendHouseNotification(
  studentId,
  action,
  timestamp
) {


  if (
    !studentId ||
    !action
  ) {

    console.warn(
      "Notification not sent: missing data."
    );


    return;

  }


  /*
   * Build notification URL.
   */

  const url =
    APPS_SCRIPT_URL +
    "?notification=1" +
    "&id=" +
    encodeURIComponent(
      String(
        studentId
      ).trim()
    ) +
    "&action=" +
    encodeURIComponent(
      action
    ) +
    "&timestamp=" +
    encodeURIComponent(
      timestamp
    ) +
    "&_=" +
    Date.now();


  console.log(
    "Sending House notification."
  );


  /*
   * Use an invisible iframe.
   *
   * This is a simple fire-and-forget
   * request from the GitHub scanner.
   */

  const iframe =
    document.createElement(
      "iframe"
    );


  iframe.style.display =
    "none";


  iframe.style.width =
    "0";


  iframe.style.height =
    "0";


  iframe.style.border =
    "0";


  iframe.src =
    url;


  document.body.appendChild(
    iframe
  );


  /*
   * Remove the iframe after a short
   * period so the page does not collect
   * invisible elements.
   */

  setTimeout(
    function() {


      try {

        iframe.remove();

      }

      catch (error) {

        console.warn(
          "Could not remove notification iframe:",
          error
        );

      }


    },
    10000
  );

}


/*************************************************
 * CLEAN UP JSONP
 *************************************************/


function cleanupJSONP(
  script,
  callbackName
) {


  try {


    if (
      script &&
      script.parentNode
    ) {


      script.parentNode.removeChild(
        script
      );


    }


  }

  catch (error) {


    console.warn(
      "Could not remove JSONP script:",
      error
    );


  }


  try {


    delete window[
      callbackName
    ];


  }

  catch (error) {


    window[
      callbackName
    ] = undefined;


  }

}


/*************************************************
 * SHOW RESULT
 *************************************************/


function showResult(
  title,
  name,
  message
) {


  document.getElementById(
    "scannerSection"
  ).style.display =
    "none";


  const resultElement =
    document.getElementById(
      "result"
    );


  resultElement.style.display =
    "flex";


  document.getElementById(
    "resultTitle"
  ).textContent =
    title ||
    "";


  document.getElementById(
    "resultName"
  ).textContent =
    name ||
    "";


  document.getElementById(
    "resultMessage"
  ).textContent =
    message ||
    "";


  setTimeout(

    function() {


      resultElement.style.display =
        "none";


      document.getElementById(
        "scannerSection"
      ).style.display =
        "block";


      setStatus(
        "Ready to scan",
        "ready"
      );


      resumeScanner();


    },

    3000

  );

}


/*************************************************
 * STATUS
 *************************************************/


function setStatus(
  message,
  className
) {


  const status =
    document.getElementById(
      "status"
    );


  status.textContent =
    message;


  status.className =
    className ||
    "ready";

}


/*************************************************
 * ERROR
 *************************************************/


function showError(
  message
) {


  document.getElementById(
    "scannerSection"
  ).style.display =
    "block";


  document.getElementById(
    "result"
  ).style.display =
    "none";


  setStatus(
    message,
    "error"
  );

}


/*************************************************
 * RESUME SCANNER
 *************************************************/


function resumeScanner() {


  scanLocked =
    false;


  try {


    if (scanner) {

      scanner.resume();

    }


  }

  catch (error) {


    console.error(
      "Could not resume scanner:",
      error
    );


  }

}


/*************************************************
 * START
 *************************************************/


window.addEventListener(
  "load",
  function() {

    startScanner();

  }
);


</script>


</body>

</html>
