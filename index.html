<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Rosenberg Health & Fitness</title>


  <!-- QR SCANNER LIBRARY -->

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>


  <style>

    /* =====================================================
       GLOBAL
       ===================================================== */

    * {
      box-sizing: border-box;
    }


    html,
    body {

      margin: 0;

      padding: 0;

      width: 100%;

      min-height: 100%;

      background: #ffffff;

      color: #111111;

    }


    body {

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      text-align: center;

      overflow-x: hidden;

    }


    /* =====================================================
       PAGE
       ===================================================== */

    .page {

      min-height: 100vh;

      display: flex;

      flex-direction: column;

    }


    /* =====================================================
       HEADER
       ===================================================== */

    .header {

      padding:
        24px
        20px
        18px;

      border-bottom:
        1px solid #111111;

    }


    .logo {

      width: 105px;

      max-width: 30vw;

      height: auto;

      display: block;

      margin:
        0 auto
        14px;

    }


    .brand {

      margin: 0;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 29px;

      font-weight: 400;

      letter-spacing: 1.5px;

      line-height: 1.15;

    }


    .subtitle {

      margin:
        8px 0 0;

      font-size: 13px;

      letter-spacing: 3px;

      text-transform: uppercase;

      color: #555555;

    }


    /* =====================================================
       MAIN CONTENT
       ===================================================== */

    .content {

      flex: 1;

      display: flex;

      flex-direction: column;

      align-items: center;

      padding:
        34px
        20px
        30px;

    }


    .scanner-section {

      width: 100%;

    }


    .instruction {

      margin:
        0 0 22px;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 27px;

      font-weight: 400;

      line-height: 1.2;

    }


    .divider {

      width: 70px;

      height: 1px;

      background: #111111;

      margin:
        0 auto
        25px;

    }


    /* =====================================================
       QR SCANNER
       ===================================================== */

    #reader {

      width: 100%;

      max-width: 380px;

      margin: 0 auto;

      background: #111111;

      border:
        1px solid #111111;

      overflow: hidden;

    }


    #reader video {

      display: block;

      width: 100% !important;

      height: auto !important;

      object-fit: cover;

    }


    /*
     * Hide unnecessary html5-qrcode controls.
     */

    #reader img {

      display: none !important;

    }


    #reader__dashboard {

      display: none !important;

    }


    #reader__dashboard_section_csr {

      display: none !important;

    }


    #reader__scan_region {

      width: 100% !important;

      min-height: 260px;

    }


    /* =====================================================
       STATUS
       ===================================================== */

    #status {

      min-height: 25px;

      margin-top: 18px;

      font-size: 13px;

      letter-spacing: 2px;

      text-transform: uppercase;

    }


    .ready {

      color: #111111;

    }


    .processing {

      color: #555555;

    }


    .error {

      color: #9b0000;

    }


    /* =====================================================
       RESULT SCREEN
       ===================================================== */

    .result {

      display: none;

      position: fixed;

      inset: 0;

      z-index: 100;

      background:
        rgba(
          255,
          255,
          255,
          0.98
        );

      align-items: center;

      justify-content: center;

      padding: 25px;

    }


    .result-card {

      width: 100%;

      max-width: 520px;

      border:
        1px solid #111111;

      background: #ffffff;

    }


    .result-content {

      padding:
        55px
        30px
        50px;

    }


    .result-title {

      margin:
        0 0 25px;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 38px;

      font-weight: 400;

      letter-spacing: 1px;

    }


    .result-name {

      margin:
        0 0 20px;

      font-size: 38px;

      font-weight: 600;

      line-height: 1.15;

    }


    .result-message {

      margin: 0;

      font-size: 17px;

      line-height: 1.5;

      color: #555555;

    }


    .result-footer {

      padding:
        14px
        20px;

      border-top:
        1px solid #111111;

      font-size: 10px;

      letter-spacing: 2px;

      text-transform: uppercase;

      color: #555555;

    }


    /* =====================================================
       MOBILE / IPAD
       ===================================================== */

    @media (max-width: 700px) {


      .header {

        padding:
          18px
          15px
          15px;

      }


      .logo {

        width: 85px;

        margin-bottom: 10px;

      }


      .brand {

        font-size: 24px;

        letter-spacing: 1px;

      }


      .subtitle {

        font-size: 11px;

        letter-spacing: 2px;

      }


      .content {

        padding:
          27px
          15px
          25px;

      }


      .instruction {

        font-size: 24px;

        margin-bottom: 18px;

      }


      .divider {

        margin-bottom: 20px;

      }


      #reader {

        max-width: 340px;

      }


      .result-content {

        padding:
          45px
          22px;

      }


      .result-title {

        font-size: 32px;

      }


      .result-name {

        font-size: 32px;

      }

    }


    /* =====================================================
       SMALL PHONES
       ===================================================== */

    @media (max-width: 430px) {


      .logo {

        width: 75px;

      }


      .brand {

        font-size: 22px;

      }


      .instruction {

        font-size: 22px;

      }


      #reader {

        max-width: 310px;

      }

    }

  </style>

</head>


<body>


  <div class="page">


    <!-- =================================================
         HEADER
         ================================================= -->

    <header class="header">


      <img
        src="logo.png"
        alt="Institut auf dem Rosenberg"
        class="logo"
      >


      <h1 class="brand">
        Rosenberg Health &amp; Fitness
      </h1>


      <p class="subtitle">
        Student Check-In / Check-Out
      </p>


    </header>



    <!-- =================================================
         MAIN
         ================================================= -->

    <main class="content">


      <section
        id="scanner-section"
        class="scanner-section"
      >


        <h2 class="instruction">
          Scan Your QR Code
        </h2>


        <div class="divider"></div>


        <div id="reader"></div>


        <div
          id="status"
          class="ready"
        >
          Ready to scan
        </div>


      </section>



      <!-- =================================================
           RESULT
           ================================================= -->

      <div
        id="result"
        class="result"
      >


        <div class="result-card">


          <div class="result-content">


            <h2
              id="result-title"
              class="result-title">
            </h2>


            <div
              id="result-name"
              class="result-name">
            </div>


            <p
              id="result-message"
              class="result-message">
            </p>


          </div>


          <div class="result-footer">

            Returning to scanner...

          </div>


        </div>


      </div>


    </main>


  </div>



<script>


/* =====================================================
   CONFIGURATION
   ===================================================== */


/*
 * NEW APPS SCRIPT WEB APP
 */

const APPS_SCRIPT_URL =
  "https://script.google.com/a/macros/instrosenberg.ch/s/AKfycbyNZ1oONCoA8Ub0L4ceoAhYry0xEdx_DId7n3yolkM7xgLyMCSseMAGNTyZrb7MChEfLw/exec";


/*
 * Scanner settings.
 */

const CAMERA_FPS = 10;


const QR_BOX_SIZE = 220;


/*
 * How long the result remains on screen.
 */

const RESULT_DURATION = 3000;


/*
 * Maximum time we wait for Apps Script.
 */

const REQUEST_TIMEOUT = 10000;



/* =====================================================
   GLOBAL VARIABLES
   ===================================================== */


let scanner = null;


let scanLocked = false;


let callbackCounter = 0;



/* =====================================================
   START CAMERA
   ===================================================== */


function startScanner() {


  /*
   * Create the QR scanner.
   */

  scanner =
    new Html5Qrcode(
      "reader"
    );


  /*
   * IMPORTANT:
   *
   * "user" means the FRONT CAMERA.
   *
   * This is intentional because the scanner
   * will be used on the front-facing iPad camera.
   */

  scanner
    .start(

      {
        facingMode: "user"
      },

      {

        fps:
          CAMERA_FPS,

        qrbox: {

          width:
            QR_BOX_SIZE,

          height:
            QR_BOX_SIZE

        },

        aspectRatio:
          1.0

      },


      /*
       * QR CODE FOUND
       */

      function(decodedText) {


        /*
         * Prevent duplicate scans.
         */

        if (scanLocked) {

          return;

        }


        scanLocked =
          true;


        /*
         * Send the QR value to Apps Script.
         */

        processQRCode(
          decodedText
        );


      },


      /*
       * NORMAL SCANNING ERRORS
       *
       * These happen constantly while the
       * scanner is looking for a QR code.
       *
       * We therefore ignore them.
       */

      function(errorMessage) {

        // Intentionally ignored.

      }

    )


    /*
     * CAMERA ERROR
     */

    .catch(
      function(error) {


        console.error(
          "Camera could not be started:",
          error
        );


        showError(
          "Camera could not be started."
        );


      }
    );

}



/* =====================================================
   PROCESS QR CODE
   ===================================================== */


function processQRCode(
  studentId
) {


  /*
   * Clean the QR value.
   */

  studentId =
    String(
      studentId
    ).trim();


  /*
   * Show processing status.
   */

  setStatus(
    "Processing...",
    "processing"
  );


  /*
   * Send request to Apps Script.
   */

  sendAttendanceRequest(
    studentId
  );

}



/* =====================================================
   SEND ATTENDANCE REQUEST
   ===================================================== */


function sendAttendanceRequest(
  studentId
) {


  /*
   * Create a unique callback name.
   */

  callbackCounter++;


  const callbackName =
    "attendanceCallback_" +
    callbackCounter;


  let finished =
    false;


  let timeoutId =
    null;


  let script =
    null;



  /*
   * Apps Script will call this function
   * when it has finished processing.
   */

  window[callbackName] =
    function(result) {


      /*
       * Ignore duplicate responses.
       */

      if (finished) {

        return;

      }


      finished =
        true;


      /*
       * Stop timeout.
       */

      clearTimeout(
        timeoutId
      );


      /*
       * Remove temporary script.
       */

      cleanupRequest(
        script,
        callbackName
      );


      /*
       * Process response.
       */

      handleResult(
        result
      );

    };



  /*
   * Build Apps Script URL.
   */

  const url =
    APPS_SCRIPT_URL +
    "?id=" +
    encodeURIComponent(
      studentId
    ) +
    "&callback=" +
    encodeURIComponent(
      callbackName
    ) +
    "&_=" +
    Date.now();



  console.log(
    "Sending attendance request:",
    studentId
  );



  /*
   * Create JSONP script.
   */

  script =
    document.createElement(
      "script"
    );


  script.src =
    url;


  script.async =
    true;



  /*
   * Network error.
   */

  script.onerror =
    function(error) {


      if (finished) {

        return;

      }


      finished =
        true;


      clearTimeout(
        timeoutId
      );


      cleanupRequest(
        script,
        callbackName
      );


      console.error(
        "Apps Script request failed:",
        error
      );


      showError(
        "Could not connect to the attendance system."
      );


      unlockScanner();

    };



  /*
   * Add request to page.
   */

  document.body.appendChild(
    script
  );



  /*
   * Safety timeout.
   */

  timeoutId =
    setTimeout(

      function() {


        if (finished) {

          return;

        }


        finished =
          true;


        cleanupRequest(
          script,
          callbackName
        );


        console.error(
          "Attendance request timed out."
        );


        showError(
          "The attendance system is taking too long to respond."
        );


        unlockScanner();


      },

      REQUEST_TIMEOUT

    );

}



/* =====================================================
   HANDLE RESULT
   ===================================================== */


function handleResult(
  result
) {


  console.log(
    "Attendance result:",
    result
  );


  /*
   * Make sure we received an object.
   */

  if (
    !result ||
    typeof result !== "object"
  ) {


    showError(
      "Invalid response from the attendance system."
    );


    unlockScanner();


    return;

  }



  /*
   * Server rejected the request.
   */

  if (
    result.success !== true
  ) {


    showResult(

      result.title ||
        "Unable to check in/out",

      result.name ||
        "",

      result.message ||
        "Please try again."

    );


    return;

  }



  /*
   * Successful attendance.
   */

  showResult(

    result.title,

    result.name,

    result.message

  );

}



/* =====================================================
   SHOW RESULT
   ===================================================== */


function showResult(
  title,
  name,
  message
) {


  /*
   * Hide scanner.
   */

  document.getElementById(
    "scanner-section"
  ).style.display =
    "none";



  /*
   * Show result overlay.
   */

  const result =
    document.getElementById(
      "result"
    );


  result.style.display =
    "flex";



  /*
   * Fill result.
   */

  document.getElementById(
    "result-title"
  ).textContent =
    title || "";


  document.getElementById(
    "result-name"
  ).textContent =
    name || "";


  document.getElementById(
    "result-message"
  ).textContent =
    message || "";



  /*
   * Return to scanner.
   */

  setTimeout(

    function() {


      result.style.display =
        "none";


      document.getElementById(
        "scanner-section"
      ).style.display =
        "block";


      setStatus(
        "Ready to scan",
        "ready"
      );


      unlockScanner();


    },

    RESULT_DURATION

  );

}



/* =====================================================
   STATUS
   ===================================================== */


function setStatus(
  message,
  className
) {


  const status =
    document.getElementById(
      "status"
    );


  status.textContent =
    message;


  status.className =
    className ||
    "ready";

}



/* =====================================================
   ERROR
   ===================================================== */


function showError(
  message
) {


  document.getElementById(
    "scanner-section"
  ).style.display =
    "block";


  document.getElementById(
    "result"
  ).style.display =
    "none";


  setStatus(
    message,
    "error"
  );

}



/* =====================================================
   UNLOCK SCANNER
   ===================================================== */


function unlockScanner() {


  scanLocked =
    false;

}



/* =====================================================
   CLEANUP JSONP REQUEST
   ===================================================== */


function cleanupRequest(
  script,
  callbackName
) {


  /*
   * Remove temporary script element.
   */

  try {


    if (
      script &&
      script.parentNode
    ) {


      script.parentNode.removeChild(
        script
      );


    }


  }

  catch (error) {


    console.warn(
      "Could not remove request:",
      error
    );


  }



  /*
   * Remove callback function.
   */

  try {


    delete window[
      callbackName
    ];


  }

  catch (error) {


    window[
      callbackName
    ] = undefined;


  }

}



/* =====================================================
   PAGE LOAD
   ===================================================== */


window.addEventListener(
  "load",
  function() {

    startScanner();

  }
);


</script>


</body>

</html>
