<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
Rosenberg Health & Fitness
</title>


<script
  src="https://unpkg.com/html5-qrcode"
  type="text/javascript">
</script>


<style>

* {
  box-sizing: border-box;
}


body {

  margin: 0;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;

  background: #f4f6f8;

  color: #222;

  text-align: center;

}


.header {

  background: #1f4e78;

  color: white;

  padding: 28px 20px;

}


.header h1 {

  margin: 0;

  font-size: 30px;

  font-weight: 600;

}


.header p {

  margin: 8px 0 0;

  font-size: 17px;

}


.container {

  max-width: 650px;

  margin: 0 auto;

  padding: 30px 20px;

}


.instruction {

  font-size: 25px;

  font-weight: 500;

  margin-bottom: 25px;

}


#reader {

  width: 100%;

  max-width: 500px;

  margin: 0 auto;

  background: white;

  border-radius: 18px;

  overflow: hidden;

  box-shadow:
    0 4px 20px rgba(0,0,0,0.10);

}


#status {

  margin-top: 25px;

  font-size: 21px;

  font-weight: 500;

  min-height: 30px;

}


.ready {

  color: #555;

}


.processing {

  color: #1f4e78;

}


.error {

  color: #dc3545;

}


.success {

  color: #1f4e78;

}


.result {

  display: none;

  background: white;

  border-radius: 20px;

  padding: 45px 25px;

  max-width: 500px;

  margin: 20px auto;

  box-shadow:
    0 5px 25px rgba(0,0,0,0.12);

}


.result h1 {

  font-size: 30px;

  margin-bottom: 15px;

}


.result .name {

  font-size: 38px;

  font-weight: bold;

  margin: 15px 0;

}


.result .message {

  font-size: 22px;

  color: #555;

}


.footer {

  margin-top: 30px;

  font-size: 15px;

  color: #777;

}

</style>

</head>


<body>


<div class="header">

  <h1>
    ROSENBERG HEALTH & FITNESS
  </h1>

  <p>
    Student Check-In / Check-Out
  </p>

</div>


<div class="container">


  <div
    id="scannerSection"
  >

    <div class="instruction">

      Please scan your QR code

    </div>


    <div id="reader"></div>


    <div
      id="status"
      class="ready"
    >

      Ready to scan

    </div>

  </div>


  <div
    id="result"
    class="result"
  >

    <h1 id="resultTitle"></h1>

    <div
      id="resultName"
      class="name">
    </div>

    <div
      id="resultMessage"
      class="message">
    </div>

  </div>


  <div class="footer">

    Health & Fitness

  </div>


</div>


<script>


/*************************************************
 * GOOGLE APPS SCRIPT
 *************************************************/

const APPS_SCRIPT_URL =
  "https://script.google.com/a/macros/instrosenberg.ch/s/AKfycbzZq6AKRHz_6-ab83I6ALVQrsslcyKvlCASxOOOWKjindU6Byg0ZPRdIMGkJ1kk0Kx3/exec";


let scanner = null;

let scanLocked = false;


/*************************************************
 * START SCANNER
 *************************************************/

function startScanner() {

  scanner =
    new Html5Qrcode("reader");


  scanner.start(

    {
      facingMode: "environment"
    },

    {

      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      }

    },

    function(decodedText) {

      if (scanLocked) {

        return;

      }

      scanLocked = true;

      processQRCode(decodedText);

    },

    function(errorMessage) {

      /*
       * Normal scanning errors
       * are ignored.
       */

    }

  )

  .catch(function(error) {

    console.error(error);

    document.getElementById(
      "status"
    ).textContent =
      "Camera could not be started. Please allow camera access.";

    document.getElementById(
      "status"
    ).className =
      "error";

  });

}


/*************************************************
 * PROCESS QR CODE
 *************************************************/

function processQRCode(studentId) {


  document.getElementById(
    "status"
  ).textContent =
    "Processing...";


  document.getElementById(
    "status"
  ).className =
    "processing";


  /*
   * Pause scanning while we process
   * the attendance record.
   *
   * IMPORTANT:
   * We DO NOT stop the camera.
   */

  try {

    scanner.pause(true);

  } catch (error) {

    console.log(error);

  }


  /*
   * Create a unique callback name.
   */

  const callbackName =
    "attendanceCallback_" +
    Date.now();


  /*
   * Create callback function.
   */

  window[callbackName] =
    function(result) {

      handleResult(result);

      /*
       * Clean up callback.
       */

      delete window[callbackName];

    };


  /*
   * JSONP request.
   *
   * This allows the GitHub page to
   * communicate with Google Apps Script
   * without leaving the scanner page.
   */

  const script =
    document.createElement("script");


  script.src =
    APPS_SCRIPT_URL +
    "?id=" +
    encodeURIComponent(studentId) +
    "&callback=" +
    callbackName;


  script.onerror =
    function() {

      delete window[callbackName];

      showError(
        "Could not connect to the attendance system."
      );

      resumeScanner();

    };


  document.body.appendChild(script);

}


/*************************************************
 * SHOW RESULT
 *************************************************/

function handleResult(result) {


  document.getElementById(
    "scannerSection"
  ).style.display =
    "none";


  document.getElementById(
    "result"
  ).style.display =
    "block";


  document.getElementById(
    "resultTitle"
  ).textContent =
    result.title;


  document.getElementById(
    "resultName"
  ).textContent =
    result.name;


  document.getElementById(
    "resultMessage"
  ).textContent =
    result.message;


  /*
   * Show result for 3 seconds.
   */

  setTimeout(

    function() {

      document.getElementById(
        "result"
      ).style.display =
        "none";


      document.getElementById(
        "scannerSection"
      ).style.display =
        "block";


      document.getElementById(
        "status"
      ).textContent =
        "Ready to scan";


      document.getElementById(
        "status"
      ).className =
        "ready";


      resumeScanner();

    },

    3000

  );

}


/*************************************************
 * RESUME CAMERA
 *************************************************/

function resumeScanner() {

  scanLocked = false;


  try {

    scanner.resume();

  }

  catch (error) {

    console.error(error);

  }

}


/*************************************************
 * ERROR
 *************************************************/

function showError(message) {

  document.getElementById(
    "scannerSection"
  ).style.display =
    "block";


  document.getElementById(
    "result"
  ).style.display =
    "none";


  document.getElementById(
    "status"
  ).textContent =
    message;


  document.getElementById(
    "status"
  ).className =
    "error";

}


/*************************************************
 * START WHEN PAGE LOADS
 *************************************************/

window.addEventListener(
  "load",
  startScanner
);

</script>


</body>

</html>
