<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Rosenberg Health & Fitness</title>


<script
  src="https://unpkg.com/html5-qrcode"
  type="text/javascript">
</script>


<style>

/* =================================================
   GENERAL
================================================= */

* {
  box-sizing: border-box;
}


html,
body {

  margin: 0;

  width: 100%;
  min-height: 100%;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;

  background: #ffffff;

  color: #111111;

  text-align: center;

}


/* =================================================
   PAGE
================================================= */

.page {

  position: relative;

  min-height: 100vh;

  display: flex;

  flex-direction: column;

  overflow: hidden;

}


/* =================================================
   SUBTLE BACKGROUND WATERMARK
================================================= */

.page::before {

  content: "";

  position: fixed;

  top: 54%;
  left: 50%;

  width: 900px;
  height: 900px;

  transform:
    translate(-50%, -50%);

  background-image:
    url("logo.png");

  background-repeat: no-repeat;

  background-position: center;

  background-size: contain;

  opacity: 0.035;

  filter: grayscale(100%);

  pointer-events: none;

  z-index: 0;

}


/* =================================================
   HEADER / BRANDING
================================================= */

.branding {

  position: relative;

  z-index: 2;

  padding:
    38px
    25px
    20px;

}


/* Rosenberg logo */

.schoolLogo {

  display: block;

  width: 175px;

  max-width: 42vw;

  height: auto;

  margin:
    0 auto
    18px;

}


/* =================================================
   H&F TITLE
================================================= */

.brandTitle {

  margin: 0;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:
    clamp(28px, 4vw, 40px);

  font-weight: 400;

  letter-spacing: 2px;

  line-height: 1.15;

}


.brandSubtitle {

  margin:
    10px
    0
    0;

  font-size:
    clamp(14px, 2vw, 17px);

  font-weight: 400;

  letter-spacing: 2px;

  text-transform: uppercase;

  color: #444444;

}


/* =================================================
   THIN DIVIDER
================================================= */

.divider {

  width: 90px;

  height: 1px;

  background: #111111;

  margin:
    23px
    auto
    0;

}


/* =================================================
   MAIN
================================================= */

.container {

  position: relative;

  z-index: 2;

  width: 100%;

  max-width: 760px;

  margin: 0 auto;

  padding:
    18px
    24px
    10px;

  flex: 1;

}


/* =================================================
   INSTRUCTION
================================================= */

.instruction {

  margin:
    0
    0
    22px;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:
    clamp(22px, 3vw, 30px);

  font-weight: 400;

  letter-spacing: 0.5px;

}


/* =================================================
   SCANNER FRAME
================================================= */

.scannerFrame {

  position: relative;

  width: 100%;

  max-width: 600px;

  margin: 0 auto;

  padding: 8px;

  background: #ffffff;

  border:
    1px solid
    #111111;

}


/* Inner scanner */

#reader {

  width: 100%;

  margin: 0 auto;

  background: #111111;

  overflow: hidden;

}


/* =================================================
   HTML5 QR CODE OVERRIDES
================================================= */

#reader__dashboard_section {

  background: #111111 !important;

}


#reader__scan_region {

  background: #111111 !important;

}


#reader img {

  max-width: 100%;

}


/* Remove unnecessary dashboard spacing */

#reader__dashboard {

  padding:
    8px
    10px !important;

}


/* =================================================
   STATUS
================================================= */

#status {

  display: flex;

  align-items: center;

  justify-content: center;

  gap: 10px;

  margin:
    20px
    auto
    0;

  min-height: 38px;

  font-size: 15px;

  font-weight: 500;

  letter-spacing: 1.5px;

  text-transform: uppercase;

}


/* Small status mark */

#status.ready::before {

  content: "";

  width: 8px;
  height: 8px;

  border-radius: 50%;

  background: #111111;

}


/* Processing */

#status.processing {

  color: #555555;

}


#status.processing::before {

  content: "";

  width: 8px;
  height: 8px;

  border-radius: 50%;

  border:
    1px solid
    #555555;

}


/* Error */

#status.error {

  color: #111111;

}


#status.error::before {

  content: "!";

  display: flex;

  align-items: center;

  justify-content: center;

  width: 18px;
  height: 18px;

  border:
    1px solid
    #111111;

  border-radius: 50%;

  font-size: 12px;

}


/* =================================================
   FOOTER
================================================= */

.footer {

  position: relative;

  z-index: 2;

  padding:
    12px
    20px
    25px;

  font-size: 11px;

  letter-spacing: 3px;

  text-transform: uppercase;

  color: #777777;

}


/* =================================================
   RESULT SCREEN
================================================= */

.result {

  display: none;

  position: fixed;

  inset: 0;

  z-index: 20;

  background:
    rgba(255,255,255,0.97);

  align-items: center;

  justify-content: center;

  padding: 25px;

  overflow: hidden;

}


/* Result watermark */

.result::before {

  content: "";

  position: absolute;

  top: 50%;
  left: 50%;

  width: 850px;
  height: 850px;

  transform:
    translate(-50%, -50%);

  background-image:
    url("logo.png");

  background-repeat: no-repeat;

  background-position: center;

  background-size: contain;

  opacity: 0.035;

  filter: grayscale(100%);

  pointer-events: none;

}


/* =================================================
   RESULT CARD
================================================= */

.resultCard {

  position: relative;

  z-index: 2;

  width: 100%;

  max-width: 560px;

  background: #ffffff;

  border:
    1px solid
    #111111;

}


/* =================================================
   RESULT CONTENT
================================================= */

.resultContent {

  padding:
    55px
    30px
    48px;

}


.resultIcon {

  width: 62px;
  height: 62px;

  margin:
    0 auto
    25px;

  display: flex;

  align-items: center;

  justify-content: center;

  border:
    1px solid
    #111111;

  border-radius: 50%;

  color: #111111;

  font-size: 30px;

  font-weight: 400;

}


.result h1 {

  margin:
    0
    0
    22px;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:
    clamp(28px, 5vw, 40px);

  font-weight: 400;

  letter-spacing: 1px;

}


.result .name {

  font-size:
    clamp(32px, 7vw, 48px);

  font-weight: 600;

  margin:
    0
    18px;

}


.result .message {

  font-size: 17px;

  color: #555555;

  letter-spacing: 0.5px;

  line-height: 1.5;

}


.resultTime {

  font-size: 20px;

  margin-top: 8px;

}


/* =================================================
   RESULT FOOTER
================================================= */

.resultFooter {

  border-top:
    1px solid
    #111111;

  padding:
    15px
    20px;

  font-size: 11px;

  letter-spacing: 2px;

  text-transform: uppercase;

  color: #555555;

}


/* =================================================
   LARGE SCREENS
================================================= */

@media (min-width: 900px) {

  .branding {

    padding-top: 45px;

  }


  .schoolLogo {

    width: 190px;

  }


  .container {

    padding-top: 15px;

  }


  .scannerFrame {

    max-width: 620px;

  }

}


/* =================================================
   IPAD / TABLET
================================================= */

@media (max-width: 700px) {

  .branding {

    padding:
      28px
      20px
      15px;

  }


  .schoolLogo {

    width: 145px;

    margin-bottom: 14px;

  }


  .brandTitle {

    font-size: 27px;

  }


  .brandSubtitle {

    font-size: 13px;

    letter-spacing: 1.5px;

  }


  .divider {

    margin-top: 18px;

  }


  .container {

    padding:
      15px
      15px
      5px;

  }


  .instruction {

    margin-bottom: 18px;

  }


  .scannerFrame {

    padding: 5px;

  }


  .resultContent {

    padding:
      45px
      20px
      40px;

  }

}


/* =================================================
   VERY SMALL SCREENS
================================================= */

@media (max-height: 700px) {

  .branding {

    padding-top: 18px;

  }


  .schoolLogo {

    width: 125px;

    margin-bottom: 10px;

  }


  .brandTitle {

    font-size: 25px;

  }


  .brandSubtitle {

    margin-top: 6px;

  }


  .divider {

    margin-top: 12px;

  }


  .container {

    padding-top: 10px;

  }


  .instruction {

    margin-bottom: 12px;

    font-size: 22px;

  }


  #status {

    margin-top: 12px;

  }


  .footer {

    padding-bottom: 12px;

  }

}

</style>

</head>


<body>


<div class="page">


  <!-- =============================================
       ROSENBERG BRANDING
  ============================================== -->

  <header class="branding">

    <img
      src="logo.png"
      alt="Institut auf dem Rosenberg"
      class="schoolLogo"
    >


    <h1 class="brandTitle">

      Rosenberg Health &amp; Fitness

    </h1>


    <p class="brandSubtitle">

      Student Check-In / Check-Out

    </p>


    <div class="divider"></div>

  </header>


  <!-- =============================================
       SCANNER
  ============================================== -->

  <main class="container">


    <div id="scannerSection">


      <div class="instruction">

        Scan Your QR Code

      </div>


      <div class="scannerFrame">

        <div id="reader"></div>

      </div>


      <div
        id="status"
        class="ready"
      >

        Ready to scan

      </div>


    </div>


  </main>


  <!-- =============================================
       RESULT SCREEN
  ============================================== -->

  <div
    id="result"
    class="result"
  >

    <div class="resultCard">


      <div class="resultContent">


        <div
          id="resultIcon"
          class="resultIcon"
        >

          ✓

        </div>


        <h1 id="resultTitle"></h1>


        <div
          id="resultName"
          class="name">
        </div>


        <div
          id="resultTime"
          class="resultTime">
        </div>


        <div
          id="resultMessage"
          class="message">
        </div>


      </div>


      <div
        id="resultFooter"
        class="resultFooter"
      >

        Returning to scanner...

      </div>


    </div>

  </div>


  <!-- =============================================
       FOOTER
  ============================================== -->

  <footer class="footer">

    Health &amp; Fitness

  </footer>


</div>


<script>


/*************************************************
 * GOOGLE APPS SCRIPT
 *************************************************/

const APPS_SCRIPT_URL =
  "https://script.google.com/a/macros/instrosenberg.ch/s/AKfycbzZq6AKRHz_6-ab83I6ALVQrsslcyKvlCASxOOOWKjindU6Byg0ZPRdIMGkJ1kk0Kx3/exec";


let scanner = null;

let scanLocked = false;


/*************************************************
 * START SCANNER
 *************************************************/

function startScanner() {

  scanner =
    new Html5Qrcode("reader");


  scanner.start(

    {
      facingMode: "environment"
    },

    {

      fps: 10,

      qrbox: {
        width: 300,
        height: 300
      }

    },

    function(decodedText) {

      if (scanLocked) {

        return;

      }

      scanLocked = true;

      processQRCode(decodedText);

    },

    function(errorMessage) {

      /*
       * Normal scanning errors
       * are ignored.
       */

    }

  )

  .catch(function(error) {

    console.error(error);

    document.getElementById(
      "status"
    ).textContent =
      "Camera could not be started. Please allow camera access.";

    document.getElementById(
      "status"
    ).className =
      "error";

  });

}


/*************************************************
 * PROCESS QR CODE
 *************************************************/

function processQRCode(studentId) {


  document.getElementById(
    "status"
  ).textContent =
    "Processing...";


  document.getElementById(
    "status"
  ).className =
    "processing";


  /*
   * Pause scanning while processing.
   *
   * The camera remains active.
   */

  try {

    scanner.pause(true);

  }

  catch (error) {

    console.log(error);

  }


  /*
   * Create unique callback name.
   */

  const callbackName =
    "attendanceCallback_" +
    Date.now();


  /*
   * Create callback function.
   */

  window[callbackName] =
    function(result) {

      handleResult(result);

      delete window[callbackName];

    };


  /*
   * JSONP request to Apps Script.
   */

  const script =
    document.createElement("script");


  script.src =
    APPS_SCRIPT_URL +
    "?id=" +
    encodeURIComponent(studentId) +
    "&callback=" +
    callbackName;


  script.onerror =
    function() {

      delete window[callbackName];

      showError(
        "Could not connect to the attendance system."
      );

      resumeScanner();

    };


  document.body.appendChild(script);

}


/*************************************************
 * SHOW RESULT
 *************************************************/

function handleResult(result) {


  /*
   * Hide scanner.
   */

  document.getElementById(
    "scannerSection"
  ).style.display =
    "none";


  /*
   * Show result screen.
   */

  const resultElement =
    document.getElementById(
      "result"
    );


  resultElement.style.display =
    "flex";


  /*
   * Populate result.
   */

  document.getElementById(
    "resultTitle"
  ).textContent =
    result.title;


  document.getElementById(
    "resultName"
  ).textContent =
    result.name;


  document.getElementById(
    "resultMessage"
  ).textContent =
    result.message;


  /*
   * Keep time field available
   * for future use.
   */

  document.getElementById(
    "resultTime"
  ).textContent =
    "";


  /*
   * Determine result icon.
   */

  const title =
    String(result.title || "")
      .toUpperCase();


  const icon =
    document.getElementById(
      "resultIcon"
    );


  if (
    title.includes("CHECK-IN")
  ) {

    icon.textContent =
      "✓";

  }

  else if (
    title.includes("CHECK-OUT")
  ) {

    icon.textContent =
      "✓";

  }

  else {

    icon.textContent =
      "!";

  }


  /*
   * Countdown.
   */

  let seconds = 3;


  const footer =
    document.getElementById(
      "resultFooter"
    );


  footer.textContent =
    "Returning to scanner in " +
    seconds;


  const countdown =
    setInterval(function() {

      seconds--;


      if (seconds > 0) {

        footer.textContent =
          "Returning to scanner in " +
          seconds;

      }

    }, 1000);


  /*
   * Return to scanner.
   */

  setTimeout(function() {

    clearInterval(countdown);


    resultElement.style.display =
      "none";


    document.getElementById(
      "scannerSection"
    ).style.display =
      "block";


    document.getElementById(
      "status"
    ).textContent =
      "Ready to scan";


    document.getElementById(
      "status"
    ).className =
      "ready";


    resumeScanner();

  }, 3000);

}


/*************************************************
 * RESUME CAMERA
 *************************************************/

function resumeScanner() {

  scanLocked = false;


  try {

    scanner.resume();

  }

  catch (error) {

    console.error(error);

  }

}


/*************************************************
 * ERROR
 *************************************************/

function showError(message) {

  document.getElementById(
    "scannerSection"
  ).style.display =
    "block";


  document.getElementById(
    "result"
  ).style.display =
    "none";


  document.getElementById(
    "status"
  ).textContent =
    message;


  document.getElementById(
    "status"
  ).className =
    "error";

}


/*************************************************
 * START WHEN PAGE LOADS
 *************************************************/

window.addEventListener(
  "load",
  startScanner
);

</script>


</body>

</html>
