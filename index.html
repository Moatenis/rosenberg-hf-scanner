<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Rosenberg Health & Fitness</title>

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>


  <style>

    /* =========================================================
       GENERAL
       ========================================================= */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #ffffff;
      color: #111111;
    }

    body {

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      text-align: center;

      -webkit-font-smoothing: antialiased;

    }


    /* =========================================================
       HEADER
       ========================================================= */

    .header {

      padding:
        26px
        20px
        20px;

      border-bottom:
        1px solid #111111;

    }


    .header h1 {

      margin: 0;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 30px;

      font-weight: 400;

      letter-spacing: 1px;

    }


    .header p {

      margin:
        8px
        0
        0;

      font-size: 14px;

      letter-spacing: 2px;

      text-transform: uppercase;

      color: #555555;

    }


    /* =========================================================
       MAIN CONTAINER
       ========================================================= */

    .container {

      width: 100%;

      max-width: 600px;

      margin: 0 auto;

      padding:
        24px
        20px
        30px;

    }


    .instruction {

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 25px;

      margin:
        0
        0
        20px;

    }


    /* =========================================================
       QR READER
       Smaller so everything fits comfortably on iPad
       ========================================================= */

    #reader {

      width: 100%;

      max-width: 360px;

      margin: 0 auto;

      background: #111111;

      overflow: hidden;

      border:
        2px
        solid
        #111111;

    }


    /*
     * html5-qrcode creates its own video element.
     * These rules keep the camera area compact.
     */

    #reader video {

      width: 100% !important;

      height: auto !important;

      max-height: 360px;

      object-fit: cover;

      display: block;

    }


    #reader__scan_region {

      min-height: 0 !important;

    }


    #reader__dashboard {

      display: none !important;

    }


    #reader__status_span {

      display: none !important;

    }


    /* =========================================================
       STATUS
       ========================================================= */

    #status {

      margin-top: 16px;

      min-height: 28px;

      font-size: 14px;

      letter-spacing: 1.4px;

      text-transform: uppercase;

    }


    .ready {
      color: #111111;
    }


    .processing {
      color: #555555;
    }


    .error {
      color: #b00000;
    }


    .success {
      color: #111111;
    }


    /* =========================================================
       RESULT OVERLAY
       ========================================================= */

    .result {

      display: none;

      position: fixed;

      inset: 0;

      background:
        rgba(
          255,
          255,
          255,
          0.98
        );

      z-index: 1000;

      align-items: center;

      justify-content: center;

      padding: 25px;

    }


    .resultCard {

      width: 100%;

      max-width: 500px;

      border:
        1px solid
        #111111;

      background: #ffffff;

    }


    .resultContent {

      padding:
        45px
        25px;

    }


    .result h1 {

      margin:
        0
        0
        20px;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 34px;

      font-weight: 400;

    }


    .name {

      font-size: 40px;

      font-weight: 600;

      margin-bottom: 18px;

    }


    .message {

      font-size: 18px;

      color: #555555;

    }


    .resultFooter {

      border-top:
        1px solid
        #111111;

      padding: 14px;

      font-size: 11px;

      letter-spacing: 2px;

      text-transform: uppercase;

      color: #555555;

    }


    /* =========================================================
       MOBILE / iPAD
       ========================================================= */

    @media (max-width: 700px) {

      .header {

        padding:
          22px
          15px
          16px;

      }

      .header h1 {

        font-size: 25px;

      }

      .header p {

        font-size: 12px;

        letter-spacing: 1.5px;

      }

      .container {

        padding:
          20px
          14px
          25px;

      }

      .instruction {

        font-size: 23px;

        margin-bottom: 16px;

      }

      #reader {

        max-width: 330px;

      }

      #reader video {

        max-height: 330px;

      }

    }


  </style>

</head>


<body>


  <!-- =======================================================
       HEADER
       ======================================================= -->

  <div class="header">

    <h1>
      Rosenberg Health &amp; Fitness
    </h1>

    <p>
      Student Check-In / Check-Out
    </p>

  </div>


  <!-- =======================================================
       MAIN
       ======================================================= -->

  <div class="container">

    <div id="scannerSection">

      <div class="instruction">
        Scan Your QR Code
      </div>

      <div id="reader"></div>

      <div
        id="status"
        class="ready"
      >
        Ready to scan
      </div>

    </div>


    <!-- =====================================================
         RESULT
         ===================================================== -->

    <div
      id="result"
      class="result"
    >

      <div class="resultCard">

        <div class="resultContent">

          <h1 id="resultTitle"></h1>

          <div
            id="resultName"
            class="name">
          </div>

          <div
            id="resultMessage"
            class="message">
          </div>

        </div>

        <div
          id="resultFooter"
          class="resultFooter"
        >
          Returning to scanner...
        </div>

      </div>

    </div>

  </div>


<script>


/* ============================================================
   CONFIGURATION
   ============================================================ */


/*
 * IMPORTANT:
 *
 * Replace the value below with the COMPLETE Web App URL
 * from Apps Script:
 *
 * Deploy
 * → Manage deployments
 * → Web app
 * → URL
 *
 * It must end with /exec
 */

const ATTENDANCE_ENDPOINT =
  "PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE";


/*
 * QR scanner settings.
 */

const QR_BOX_SIZE = 220;

const SCAN_FPS = 10;


/*
 * Maximum time we allow the attendance system
 * to respond before displaying an error.
 *
 * This does NOT cancel the Apps Script operation.
 * It only prevents the scanner from appearing
 * stuck indefinitely.
 */

const ATTENDANCE_TIMEOUT = 15000;


/* ============================================================
   GLOBALS
   ============================================================ */

let scanner = null;

let scanLocked = false;

let requestCounter = 0;


/* ============================================================
   START SCANNER
   ============================================================ */

function startScanner() {

  if (
    ATTENDANCE_ENDPOINT ===
    "PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE"
  ) {

    showError(
      "Attendance system is not configured."
    );

    return;

  }


  scanner =
    new Html5Qrcode("reader");


  scanner
    .start(

      /*
       * FRONT CAMERA
       *
       * "user" requests the front-facing camera.
       */

      {
        facingMode: "user"
      },


      {
        fps: SCAN_FPS,

        qrbox: {
          width: QR_BOX_SIZE,
          height: QR_BOX_SIZE
        },

        aspectRatio: 1.0

      },


      function(decodedText) {

        if (scanLocked) {
          return;
        }


        /*
         * Lock immediately so the same QR code
         * cannot trigger multiple attendance records.
         */

        scanLocked = true;


        processQRCode(
          decodedText
        );

      },


      function(errorMessage) {

        /*
         * Normal QR scanning errors are ignored.
         */

      }

    )

    .catch(
      function(error) {

        console.error(
          "Camera error:",
          error
        );


        showError(
          "Camera could not be started."
        );

      }
    );

}


/* ============================================================
   PROCESS QR CODE
   ============================================================ */

function processQRCode(studentId) {

  setStatus(
    "Processing...",
    "processing"
  );


  /*
   * Pause scanner while attendance is processed.
   */

  try {

    if (scanner) {
      scanner.pause(true);
    }

  }

  catch (error) {

    console.warn(
      "Could not pause scanner:",
      error
    );

  }


  /*
   * Use JSONP instead of fetch().
   *
   * This is the important part.
   *
   * GitHub Pages and Apps Script are different origins.
   *
   * A normal fetch() can be blocked by CORS.
   *
   * JSONP works through a dynamically-created
   * <script> element.
   */

  sendAttendanceRequest(
    studentId
  );

}


/* ============================================================
   SEND ATTENDANCE REQUEST
   ============================================================ */

function sendAttendanceRequest(studentId) {

  requestCounter++;

  const callbackName =
    "attendanceCallback_" +
    requestCounter;


  let completed = false;

  let timeoutId = null;

  let script = null;


  /*
   * Global JSONP callback.
   */

  window[callbackName] =
    function(result) {

      if (completed) {
        return;
      }

      completed = true;


      clearTimeout(
        timeoutId
      );


      cleanupJSONP(
        script,
        callbackName
      );


      /*
       * Attendance has now been processed
       * by Apps Script.
       */

      handleAttendanceResult(
        result
      );

    };


  /*
   * Create the request URL.
   */

  const url =
    ATTENDANCE_ENDPOINT +
    "?id=" +
    encodeURIComponent(
      String(studentId).trim()
    ) +
    "&callback=" +
    encodeURIComponent(
      callbackName
    ) +
    "&_=" +
    Date.now();


  /*
   * Create the script element.
   */

  script =
    document.createElement(
      "script"
    );


  script.src = url;

  script.async = true;


  /*
   * If the script itself fails to load,
   * show a useful error.
   */

  script.onerror =
    function(error) {

      if (completed) {
        return;
      }

      completed = true;


      clearTimeout(
        timeoutId
      );


      cleanupJSONP(
        script,
        callbackName
      );


      console.error(
        "Attendance endpoint error:",
        error
      );


      showError(
        "Could not connect to the attendance system."
      );


      resumeScanner();

    };


  /*
   * Add to page.
   */

  document.body.appendChild(
    script
  );


  /*
   * Timeout.
   *
   * This prevents the scanner from appearing
   * frozen forever.
   */

  timeoutId =
    setTimeout(
      function() {

        if (completed) {
          return;
        }

        completed = true;


        cleanupJSONP(
          script,
          callbackName
        );


        console.error(
          "Attendance request timed out."
        );


        showError(
          "The attendance system is taking too long to respond."
        );


        resumeScanner();

      },
      ATTENDANCE_TIMEOUT
    );

}


/* ============================================================
   CLEAN UP JSONP
   ============================================================ */

function cleanupJSONP(
  script,
  callbackName
) {

  try {

    if (
      script &&
      script.parentNode
    ) {

      script.parentNode.removeChild(
        script
      );

    }

  }

  catch (error) {

    console.warn(
      "Could not remove JSONP script:",
      error
    );

  }


  try {

    delete window[
      callbackName
    ];

  }

  catch (error) {

    window[
      callbackName
    ] = undefined;

  }

}


/* ============================================================
   HANDLE ATTENDANCE RESULT
   ============================================================ */

function handleAttendanceResult(
  result
) {

  console.log(
    "Attendance response:",
    result
  );


  /*
   * Make sure we received an object.
   */

  if (
    !result ||
    typeof result !== "object"
  ) {

    showError(
      "Invalid response from the attendance system."
    );

    resumeScanner();

    return;

  }


  /*
   * If Apps Script returned an error,
   * show its message.
   */

  if (
    result.success === false
  ) {

    showResult(
      result.title ||
        "Unable to check in/out",

      result.name ||
        "",

      result.message ||
        "Please try again."
    );


    return;

  }


  /*
   * Successful attendance.
   */

  if (
    result.success === true
  ) {

    showResult(
      result.title ||
        "",

      result.name ||
        "",

      result.message ||
        ""
    );


    /*
     * IMPORTANT:
     *
     * We do NOT wait for the email.
     *
     * The attendance record has already been saved.
     *
     * The email is sent separately.
     */

    sendNotification(
      result
    );


    return;

  }


  /*
   * Unexpected response.
   */

  showError(
    "Unexpected response from the attendance system."
  );


  resumeScanner();

}


/* ============================================================
   SEND HOUSE NOTIFICATION
   ============================================================ */

function sendNotification(
  result
) {

  /*
   * The backend needs the student ID.
   *
   * We stored it when the scan started.
   */

  const studentId =
    result.studentId ||
    window.lastScannedStudentId;


  if (!studentId) {

    console.warn(
      "No student ID available for notification."
    );

    return;

  }


  const action =
    result.action ||
    "";


  if (!action) {

    return;

  }


  const callbackName =
    "notificationCallback_" +
    Date.now();


  let script = null;


  window[callbackName] =
    function(response) {

      cleanupJSONP(
        script,
        callbackName
      );

    };


  const url =
    ATTENDANCE_ENDPOINT +
    "?notification=1" +
    "&id=" +
    encodeURIComponent(
      String(studentId).trim()
    ) +
    "&action=" +
    encodeURIComponent(
      action
    ) +
    "&timestamp=" +
    encodeURIComponent(
      Date.now()
    ) +
    "&callback=" +
    encodeURIComponent(
      callbackName
    );


  script =
    document.createElement(
      "script"
    );


  script.src = url;

  script.async = true;


  script.onerror =
    function(error) {

      console.warn(
        "Notification request failed:",
        error
      );


      cleanupJSONP(
        script,
        callbackName
      );

    };


  document.body.appendChild(
    script
  );


  /*
   * We deliberately do not wait for this request.
   */

}


/* ============================================================
   SHOW RESULT
   ============================================================ */

function showResult(
  title,
  name,
  message
) {

  document.getElementById(
    "scannerSection"
  ).style.display =
    "none";


  const resultElement =
    document.getElementById(
      "result"
    );


  resultElement.style.display =
    "flex";


  document.getElementById(
    "resultTitle"
  ).textContent =
    title || "";


  document.getElementById(
    "resultName"
  ).textContent =
    name || "";


  document.getElementById(
    "resultMessage"
  ).textContent =
    message || "";


  /*
   * Return to scanner after 3 seconds.
   */

  setTimeout(
    function() {

      resultElement.style.display =
        "none";


      document.getElementById(
        "scannerSection"
      ).style.display =
        "block";


      setStatus(
        "Ready to scan",
        "ready"
      );


      resumeScanner();

    },
    3000
  );

}


/* ============================================================
   STATUS
   ============================================================ */

function setStatus(
  message,
  className
) {

  const status =
    document.getElementById(
      "status"
    );


  status.textContent =
    message;


  status.className =
    className || "ready";

}


/* ============================================================
   ERROR
   ============================================================ */

function showError(
  message
) {

  document.getElementById(
    "scannerSection"
  ).style.display =
    "block";


  document.getElementById(
    "result"
  ).style.display =
    "none";


  setStatus(
    message,
    "error"
  );

}


/* ============================================================
   RESUME SCANNER
   ============================================================ */

function resumeScanner() {

  scanLocked = false;


  try {

    if (scanner) {

      scanner.resume();

    }

  }

  catch (error) {

    console.warn(
      "Could not resume scanner:",
      error
    );

  }

}


/* ============================================================
   START
   ============================================================ */

window.addEventListener(
  "load",
  function() {

    startScanner();

  }
);


/* ============================================================
   STORE LAST STUDENT ID
   ============================================================ */

const originalProcessQRCode =
  processQRCode;


/*
 * We need the scanned ID later for the
 * separate notification request.
 */

processQRCode =
  function(studentId) {

    window.lastScannedStudentId =
      String(studentId).trim();


    originalProcessQRCode(
      studentId
    );

  };


</script>


</body>

</html>
